<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="tokens.css">
  <title>Invoice board selected target</title>
</head>
<body>
  <main id="invoice-board" aria-label="Invoices" data-density="compact" data-layout="desktop-table">
    <header>
      <h1>Invoices</h1>
    </header>
    <div id="invoice-board-columns" data-order="id,status,region,total">
      <span>Invoice</span><span>Status</span><span>Region</span><span>Total</span>
    </div>
    <span id="invoice-status-badge" data-presentation="badge">Draft</span>
    <section id="invoice-loading" role="status" aria-live="polite">Loading invoice queue</section>
    <section id="invoice-empty">
      <svg id="invoice-empty-asset" data-asset-key="invoice-stack" aria-hidden="true"></svg>
      <p>No invoices yet</p>
    </section>
    <section id="invoice-error">
      <p>Invoice board unavailable</p>
      <button id="retry-invoices" type="button">Retry</button>
    </section>
  </main>
</body>
</html>
