name: Package CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

jobs:
  windows-affected-test-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Verify Windows npm subprocess launch
        run: node --test tests/ty-context/affected-test-portable-command.test.mjs

  level4-routing:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.route.outputs.required }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Resolve Level 4 routing
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || { [ "$EVENT_NAME" = "push" ] && [ "$EVENT_REF" = "refs/heads/main" ]; }; then
            required=true
          else
            if [ "$EVENT_NAME" = "pull_request" ]; then
              route_base="origin/$PR_BASE_REF"
            elif git cat-file -e "${PUSH_BASE_SHA}^{commit}" 2>/dev/null; then
              route_base="$PUSH_BASE_SHA"
            else
              route_base="$(git merge-base HEAD origin/main)"
            fi
            mkdir -p .artifacts/affected-tests
            node tools/run_affected_tests.mjs --list --base "$route_base" > .artifacts/affected-tests/plan.json
            required="$(jq -r '.level4.required' .artifacts/affected-tests/plan.json)"
          fi
          if [ "$required" != "true" ] && [ "$required" != "false" ]; then
            echo "Invalid Level 4 routing result: $required" >&2
            exit 1
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"

  windows-level4-runtime:
    needs: level4-routing
    if: ${{ needs.level4-routing.outputs.required == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build package once
        run: npm run build --workspace project-tiny-context-harness
      - name: Verify Windows Level 4 runtime boundaries
        run: node --test --test-concurrency=1 tests/ty-context/long-task-level4-acquisition.test.mjs tests/ty-context/long-task-level4-package-promotion.test.mjs

  pull-request:
    needs: level4-routing
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript formatting
        run: npm run format:check
      - name: Typecheck package and build once
        run: npm run build --workspace project-tiny-context-harness
      - name: Core Trust package tests
        if: ${{ needs.level4-routing.outputs.required != 'true' }}
        env:
          TY_CONTEXT_TEST_TIMING_DIR: .artifacts/test-timing/pull-request
          TY_CONTEXT_TEST_SUITE_BUDGET_PROFILE: github-ubuntu-v2
        run: |
          set -o pipefail
          npm run test:trust:built --workspace project-tiny-context-harness --ignore-scripts 2>&1 | tee package-trust-test.log
      - name: Level 4 routed package tests
        if: ${{ needs.level4-routing.outputs.required == 'true' }}
        env:
          TY_CONTEXT_TEST_TIMING_DIR: .artifacts/test-timing/pull-request
          TY_CONTEXT_TEST_SUITE_BUDGET_PROFILE: github-ubuntu-v2
        run: |
          set -o pipefail
          npm run test:level4:built --workspace project-tiny-context-harness --ignore-scripts 2>&1 | tee package-level4-test.log
      - name: Upload package test diagnostics
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: package-test-diagnostics-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            package-trust-test.log
            package-level4-test.log
            tests/ty-context/long-task-source-authority-closure.test.mjs
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload package test timing
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: package-test-timing-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/test-timing/pull-request/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Structural closure cost non-degradation gate
        if: always()
        run: node tools/structural_closure_cost_gate.mjs --artifact .artifacts/structural-closure-cost/report.json
      - name: Upload structural closure cost metrics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: structural-closure-cost-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/structural-closure-cost/report.json
          if-no-files-found: error
          retention-days: 30
      - name: Collect self-hosting cost diagnostics
        if: always()
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          report_args=(--artifact .artifacts/self-hosting-cost/report.json --structural-report .artifacts/structural-closure-cost/report.json)
          for timing in .artifacts/test-timing/pull-request/*.json; do
            if [ -f "$timing" ]; then
              report_args+=(--timing "$timing")
            fi
          done
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_REF" ]; then
            report_args+=(--base-ref "origin/$PR_BASE_REF")
          elif git cat-file -e "${PUSH_BASE_SHA}^{commit}" 2>/dev/null; then
            report_args+=(--base-ref "$PUSH_BASE_SHA")
          fi
          npm run report:self-hosting-cost -- "${report_args[@]}"
      - name: Upload self-hosting cost diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: self-hosting-cost-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/self-hosting-cost/report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Check package canonical source drift
        run: node packages/ty-context/dist/cli.js package check-source
      - name: Validate Context and touched-source modularity
        run: make validate-harness
      - name: Validate changed-source modularity and waiver lifecycle
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            modularity_base="origin/$PR_BASE_REF"
          elif git cat-file -e "${PUSH_BASE_SHA}^{commit}" 2>/dev/null; then
            modularity_base="$PUSH_BASE_SHA"
          else
            modularity_base="$(git merge-base HEAD origin/main)"
          fi
          node packages/ty-context/dist/cli.js check-modularity --base "$modularity_base" --fail-on-warning
      - name: Quickstart smoke
        run: node tools/quickstart_smoke.mjs

  main:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript formatting
        run: npm run format:check
      - name: Build package
        run: npm run build --workspace project-tiny-context-harness
      - name: Validate modularity waiver lifecycle
        run: node packages/ty-context/dist/cli.js check-modularity --config-only --fail-on-warning
      - name: Complete package tests
        env:
          TY_CONTEXT_TEST_TIMING_DIR: .artifacts/test-timing/main
          TY_CONTEXT_TEST_SUITE_BUDGET_PROFILE: github-ubuntu-v2
        run: |
          set -o pipefail
          npm test --workspace project-tiny-context-harness --ignore-scripts 2>&1 | tee package-test.log
      - name: Upload package test diagnostics
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: package-test-diagnostics-main-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-test.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload package test timing
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: package-test-timing-main-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/test-timing/main/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Structural closure cost non-degradation gate
        if: always()
        run: node tools/structural_closure_cost_gate.mjs --artifact .artifacts/structural-closure-cost/report.json
      - name: Upload structural closure cost metrics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: structural-closure-cost-main-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/structural-closure-cost/report.json
          if-no-files-found: error
          retention-days: 30
      - name: Collect self-hosting cost diagnostics
        if: always()
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          report_args=(--artifact .artifacts/self-hosting-cost/report.json --structural-report .artifacts/structural-closure-cost/report.json)
          for timing in .artifacts/test-timing/main/*.json; do
            if [ -f "$timing" ]; then
              report_args+=(--timing "$timing")
            fi
          done
          if [ "$EVENT_NAME" = "push" ] && git cat-file -e "${PUSH_BASE_SHA}^{commit}" 2>/dev/null; then
            report_args+=(--base-ref "$PUSH_BASE_SHA")
          fi
          npm run report:self-hosting-cost -- "${report_args[@]}"
      - name: Upload self-hosting cost diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: self-hosting-cost-main-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/self-hosting-cost/report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Check package canonical source drift
        run: node packages/ty-context/dist/cli.js package check-source
      - name: Validate Context and touched-source modularity
        run: make validate-harness
      - name: Quickstart smoke
        run: node tools/quickstart_smoke.mjs
      - name: Pack preview
        run: npm run preview:pack
