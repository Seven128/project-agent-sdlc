name: npm Trusted Publish
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Must match the package version.
        required: true
        default: '0.12.0'
      dry_run:
        description: Prepare and test without publishing.
        required: true
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node packages/ty-context/dist/cli.js package check-source
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check requested version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: node -e "if(require('./packages/ty-context/package.json').version !== process.env.EXPECTED_VERSION) throw Error('version mismatch')"
      - run: npm run build
      - name: Pack and verify the exact artifact
        run: node tools/prepare_release.mjs
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: npm-package-${{ github.run_id }}
          path: .artifacts/releases/*.tgz
          if-no-files-found: error
      - name: Publish the tested tarball
        if: ${{ !inputs.dry_run }}
        run: npm publish "$TINY_CONTEXT_TARBALL" --access public --provenance
