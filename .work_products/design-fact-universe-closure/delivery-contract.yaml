                - obligation.expected-canonical-indexed-fact-universe-equality
              applicability_ref: root-success
              observation: expected_canonical_indexed_fact_universe_equality
              evidence_capabilities:
                - target_runtime
              operator: equals
              expected: true
            - key: formal-ready-handoff-fail-closed-boundary
              criterion: A formal handoff may report `ready` only when there is no important in-scope UI/UX decision left for a developer to invent and every applicable observable fact is generated, readable, indexed, mapped, source-attributed and assigned a falsifiable method. Any `decision_required`, `unavailable`, unreadable or stale resource, unknown applicability, missing canonical dependency, unclosed condition/property universe, unsupported oracle capability, source conflict or unbound asset remains blocking. Exploration, deliberately partial constraints and historical resources remain usable only under their honest narrower interpretation; they cannot be relabeled as the new exact target or visual baseline.
              claims:
                - requirement.formal-ready-handoff-fail-closed-boundary
              applicability_ref: root-success
              observation: formal_ready_handoff_fail_closed_boundary
              evidence_capabilities:
                - target_runtime
              operator: equals
              expected: true
            - key: per-fact-native-evidence-verdict
              criterion: Every Long-Task `design_method` current-execution record must carry one typed result for each and only each expected `fact_ref`. Each result binds the actual observation, expected/comparison target and comparison result, applicable tolerance or explicit exact-comparison mode, pass/fail verdict, and immutable oracle identity/version/digest or named external-runtime TCB identity. The decoder and Final Gate must reject a missing/extra/duplicate Fact result, aggregate-only method Boolean, absent observation/comparison/tolerance/oracle identity, failed Fact, reused indistinguishable observation, or oracle/tolerance drift even when the enclosing method record claims success.
              claims:
                - obligation.per-fact-native-evidence-verdict
              applicability_ref: root-success
              observation: per_fact_native_evidence_verdict
              evidence_capabilities:
                - target_runtime
              operator: equals
              expected: true
            - key: authoring-obligation-universe-ac
              criterion: Given a formal multi-Surface mobile implementation commission with an adopted design system and explicitly scoped product/platform semantics, when `design-resource-authoring` plans and commissions the resources, then its request and returned canonical source cover every scoped Surface, subject/Anatomy identity, standard condition axis, applicable combination and atomic property family listed above or retain an exact blocking disposition; a provider result containing only assembled default pages, shared styles, screenshots or broad component summaries cannot be reported as a ready handoff.
