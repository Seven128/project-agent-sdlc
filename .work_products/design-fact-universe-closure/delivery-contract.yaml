    forbidden_paths: []
    forbidden_shortcuts: []
  acceptance:
    checks: []
    counterfactual_controls: []
    external_confirmations: []
outcomes:
  - key: design-fact-completeness
    title: Formal Expected Fact Universe, canonical manifest and per-Fact evidence closure
    stage: delivery
    depends_on: []
    applicability:
      - key: root-success
        target_ref: harness-package-runtime
        journey_role: success
        dimensions:
          - key: delivery-state

            value: ready
        given_refs:
          - repository-source-ready
        when_refs:
          - inspect-design-fact-closure
    product:
      observable_result: "Formal selected Web/App implementation resources default to complete observable-design-fact granularity: authoring derives the full material in-scope Expected Fact Universe, canonical resources express and independently inventory it, the residual handoff indexes the same exact facts, and Default or Long-Task preserves each Fact through its production owner and a per-Fact current-snapshot verdict; when an exact target carries a complete platform-specific pixel reference, pixel fidelity is mandatory rather than optional."
      result_applicability_refs:
        - root-success
      success_path_required: true
      degradation_path_required: false
      owner:
        label: Harness selected-design handoff and existing conformance carriers
        context_refs:
          - project_context/areas/harness-package/contracts/design-resource-handoff.md
          - project_context/areas/harness-package/contracts/workflow-contract.md
          - project_context/areas/harness-package/decision-rationale/long-task-workflow.md
          - project_context/areas/harness-package/implementation-index.md
          - project_context/areas/harness-package/verification.md
        path_globs:
          - packages/ty-context/src/lib/design-resource-*.ts
          - packages/ty-context/src/lib/execution-target-capabilities.ts
          - packages/ty-context/src/lib/long-task-design-resource-handoff.ts
          - packages/ty-context/src/lib/long-task-design-target-capabilities.ts
          - packages/ty-context/src/lib/long-task-ui-*.ts
          - packages/ty-context/src/lib/long-task-authority-material*.ts
          - packages/ty-context/src/lib/long-task-evidence-capability-*.ts
          - packages/ty-context/src/lib/long-task-playwright-*.ts
          - packages/ty-context/src/lib/long-task-semantic-drift-migration.ts
          - packages/ty-context/src/lib/modularity.ts
          - packages/ty-context/src/schemas/long-task-delivery-v2/*.json
          - packages/ty-context/src/commands/design-resource.ts
          - tests/ty-context/design-resource-*.mjs
          - tests/ty-context/long-task-*.mjs
          - tests/ty-context/visual-delivery-guidance.test.mjs
          - tests/ty-context/test-suite-runtime.test.mjs
          - tests/ty-context/affected-test-selection.test.mjs
          - tests/ty-context/check-modularity.test.mjs
          - tests/ty-context/orientation-fast-path.test.mjs
          - tests/ty-context/workflow-contract-routing.test.mjs
          - tools/affected_test_selection.mjs
          - tools/test_suite_policy.mjs
          - project_context/**/*.md
          - .codex/ty-context-managed/**
          - .codex/skills/**
          - AGENTS.md
          - packages/ty-context/assets/**
          - PROJECT_SPEC.md
          - README.md
          - README.zh-CN.md
          - packages/ty-context/README.md
          - docs/design-fact-completeness.md
          - packages/ty-context/src/lib/design-resource-fact-manifest-*.ts
      requirements:
        - key: default-observable-design-fact-granularity
          statement: "UI/UX design-resource consumption must default to observable design facts rather than semantic Control granularity: the inventory includes every material layout geometry, pixel appearance, design token, visible content, component or small-element anatomy and style, component state, interaction, motion, responsive behavior, input behavior, accessibility semantic, and asset fact that the selected resources explicitly express for an in-scope target and condition."
          required_proof_surfaces:
            - api_contract
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: resource-fact-inventory-closure
          statement: The selected handoff must contain one exhaustive, stable-keyed design-fact inventory plus an explicit closure disposition for every selected target resource; every fact binds one subject, target, atomic condition, UI/UX dimension, typed resource evidence, originating Source Item, and required verification method, while unreadable, unsupported, conflicting, unclassified, unresolved, or unavailable material meaning blocks readiness.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: pixel-fidelity-by-expression
          statement: Every selected `exact_target` must carry full-target layout-geometry and visual-pixel facts for every declared atomic condition, and the validator must derive `layout_geometry` and `visual_pixel` as required methods from those facts; a target without sufficient immutable information for that comparison must remain a constraint, unresolved, or unavailable instead of silently weakening to approximate fidelity.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: complete-fact-consumption
          statement: "The default Workflow and Long-Task Workflow must conserve the exact selected fact set without sampling or silent grouping: every covered fact is mapped to its production owner and real root-entry journey, every method and condition carries the exact fact references into an independently attributable current-execution observation, and any missing, duplicate, mismatched, unimplemented, unexecuted, stale, failed, or indistinguishable fact blocks a complete selected-design-conformance claim."
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: honest-expression-boundary
          statement: "The guarantee remains bounded by what selected readable resources explicitly express: a static image governs all shown pixels for its declared condition but does not invent unshown interaction, motion, responsive, input, permission, recovery, or accessibility behavior; unsupported formats or facts remain blocking, and the named project design extractor or oracle remains an explicit trusted-computing-boundary component rather than an assumed universal semantic interpreter."
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: non-ui-and-control-semantics-preserved
          statement: Non-UI requirements continue to close as atomic Requirements, Technical Obligations, Constraints, Forbidden Shortcuts, Claims, and Assertions exactly as expressed, while the existing 22-field Control and cross-Control relation model remains the semantic interaction owner and is not repurposed into a registry of every image, element, style property, or implementation `div`.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: public-guidance-and-authoring-default
          statement: "Package-managed authoring, UI/UX, engineering, Long-Task, default-workflow, English, Chinese, and package README guidance must all teach the same default: inspect all selected resources, produce complete fact/resource closure, require pixel proof when the target expresses it, preserve explicit limitations, and never describe handoff preflight or resource integrity as production conformance."
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: formal-authoring-design-obligation-universe
          statement: For a formal selected Web/App implementation handoff, `design-resource-authoring` must default to deriving the complete material in-scope UI/UX decision universe before commissioning and must iterate the provider until every obligation is expressed by readable canonical implementation resources or has an explicit `not_applicable`, `excluded_by_scope`, `decision_required`, or `unavailable` disposition. It is not sufficient to inventory only what an initially generated page, default state, screenshot, broad dimension row, or provider summary happened to contain; the authoring obligation starts from the requested surfaces, product semantics, adopted design system, target platforms, applicable observable-condition axes, subject hierarchy, and atomic property catalog. Its atomic identity is one applicable `subject × target × condition × variation × property` Fact Cell.
          required_proof_surfaces:
            - api_contract
            - runtime_behavior
          applicability_refs:
            - root-success

        - key: independent-canonical-fact-manifest
          statement: Every formal selected implementation target must include one immutable machine-readable canonical `design-resource-observable-fact-manifest-v1` inside the completely acquired source-profile dependency closure. The manifest independently enumerates its target resources and digests, complete subject hierarchy, target-level condition space, subject-local Variant/State/interaction-phase space, atomic property facts, typed value locators, applicability dispositions, exclusions, blockers, and inspection provenance. The residual handoff may repeat stable identities for downstream binding, but preflight must compare those sets to the manifest rather than treating handoff-declared subjects, conditions, facts, or resource closure as proof of their own completeness.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: subject-hierarchy-instance-anatomy-closure
          statement: The canonical subject universe must give stable independently queryable identities and exact parent/instance relationships for every in-scope Surface/page, flow, page region, overlay or system-presented region, component family, component instance, Control, Anatomy Part/slot, smaller visual primitive, text run, icon, media element, asset, and applicable platform/system-UI element. It must preserve `instance-of`, slot/override/inheritance and precedence meaning where used, and it must prevent a Surface-only or component-family-only declaration from concealing unindexed instances, internal parts, or unique controls.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: complete-condition-axis-and-value-closure
          statement: "The canonical condition catalog must explicitly disposition all 33 standard condition axes and any scoped custom axes that can alter the target: product display mode and system color scheme; platform and OS version; device/form-factor profile; viewport width and height, orientation, pixel density, Safe Area/cutout, aspect/window/split/fold state; locale/language/script, layout direction and pseudo-localization; default and stressed content/data cases; default and 200-percent or other required text scaling; touch, pointer, keyboard, stylus and applicable assistive input; screen reader, switch and voice-control use; full/reduced motion, reduced transparency, increased contrast, bold text, button-shape or equivalent system accessibility preferences; virtual keyboard/IME and system bars; permission/capability, connectivity, foreground/background/restoration and other lifecycle states whose visible result changes. Each applicable axis has exact stable values; each irrelevant axis is explicitly closed rather than omitted."
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: compound-applicability-and-precedence-closure
          statement: Applicable target-condition combinations and each subject's five variation axes—Variant × State × interaction phase × presence phase × instance case—must be closed as exact machine-enumerable spaces, including compound-state and style/behavior precedence. Every applicable combination is present; every removed combination has an explicit exact exclusion or non-applicability rationale; `decision_required` or `unavailable` combinations block readiness. A default state, representative viewport, pairwise/risk sample, isolated axis value, or one shared style may cover another combination only when the canonical source provides an exact machine-checkable invariant/equivalence rule. Continuous viewport or text-pressure behavior must additionally expose exact breakpoint/range/interpolation/reflow constraints, so snapshots at 360, 390, and 430 pixels do not leave widths between them to developer invention.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: atomic-property-catalog-and-value-addressability
          statement: Every observable fact must bind one stable subject, target condition, subject-local variation, atomic property key, property family, UI/UX dimension, value kind, typed value locator, evidence locator, originating Source Item, and required verification method. The closed property catalog must prevent one broad “visual”, “component”, “state”, or eight-dimension fact from standing in for its constituent values, while permitting versioned/custom inspector-declared properties to extend rather than weaken the standard catalog. Critical numerical or semantic values may live in HTML, CSS, JS, JSON, SVG, tokens, assets, or an equivalent canonical source, but never only in a bitmap, preview, prose summary, or unresolvable locator.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: page-assembly-and-spatial-fact-closure
          statement: Page and Surface assembly facts must cover the coordinate system, content width, Safe Area and edge constraints; top bars, content regions, bottom navigation, overlays, sheets and dialogs; Grid/Flex/fixed/adaptive/minimum/maximum/aspect sizing; exact margins, padding, gaps, alignment, baselines, anchoring, transforms and region relationships; stacking order, z-order/elevation, clipping, masks, overflow and occlusion; scrolling container ownership, nested-scroll arbitration, indicators, insets, bounce/overscroll, sticky/fixed/overlay/modal/bottom-sheet behavior; and the exact resize, reflow, wrap, reorder, priority, expansion and scrolling rules for every applicable viewport and text-pressure condition.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: component-visual-content-and-media-fact-closure
          statement: Every component, unique Control and Anatomy Part must expose applicable width/height/min/max/aspect and touch target or hit slop; padding/gap/margin/alignment/baseline; font family and fallback, variable axes/features, size, weight, line height, letter spacing, numeral style, hyphenation and date/time/number/unit formatting; foreground/background/fill/stroke/gradient colors and exact tokens; border width/style/dash/cap/join, radius, shadow/elevation/blur/vibrancy/blend/opacity; icon glyph, size, stroke, tint, position and text gap; image/media aspect, density/color-space variant, crop/fit/focal point, mask, placeholder/error/decode/fallback behavior; copy, maximum lines, truncation, wrapping and content-pressure behavior; and every part's visibility, availability, state style and layout impact.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: interaction-navigation-scroll-and-recovery-fact-closure
          statement: Behavior facts must cover trigger conditions; hit testing, pointer-event and gesture-recognizer priority; default, hover where applicable, focus, press-in, pressed, selected, dragging, cancelled and replacement phases; thresholds, axes, bounds, velocity, snap points and nested-scroll/gesture arbitration; validation, focus/selection/cursor behavior and keyboard traversal; navigation destination, back/dismiss, deep-link and restoration behavior; optimistic, loading, refreshing, empty, stale, offline, disabled, conflict, permission, degradation, error, retry, success and recovery presentation; request replacement, repeated input and concurrent-operation behavior; and exact visible, spoken, sound or haptic feedback and its timing. Product/data rules remain in their owning Source, while every visible consequence is represented in design facts.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: motion-haptic-and-interruption-fact-closure
          statement: Every applicable motion or gesture transition must expose its trigger and priority, start and end values, animated properties and coordinate/pivot, duration, delay, easing or spring mass/stiffness/damping/initial velocity, sequencing, overshoot/clamping, drag threshold, velocity and snap/boundary behavior, interrupt/cancel/reverse/request-replacement semantics, and the rule for continuing from the currently displayed value when operated again mid-animation. Haptic and sound type plus trigger time must be exact, and reduced-motion/reduced-transparency alternatives must be independently specified rather than inferred from the full-motion path.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: platform-localization-system-and-render-target-closure
          statement: Each supported platform has an explicit render target and adaptation facts for 360-, 390-, and 430-pixel widths plus applicable height/orientation/device profiles, Safe Area and density; iOS/Android native convention or system-control differences; status/navigation bars, permission/system sheets, software keyboard/IME avoidance and other system-presented UI; locale/script/RTL and formatting changes; and font fallback/rasterization differences. Pixel fidelity means a deterministic per-platform target with declared OS, device profile, density, fonts, color space, system preferences, data/clock and animation state plus reviewable tolerances or masks for legitimate rasterization/system variance—not identical physical pixels across unlike platforms and not an implementation-generated self-baseline.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: accessibility-semantic-navigation-and-visual-closure
          statement: Accessibility facts must separately cover semantic role/name/value/hint/state, grouping and relationships, reading and focus order, focus visibility, keyboard path, custom actions, live-region/announcement behavior, screen-reader/switch/voice-control operation, touch target, non-color cues and contrast, text scaling/reflow, and applicable reduced-motion, reduced-transparency, increased-contrast, bold-text, button-shape or other platform preferences. A visual screenshot, generic accessibility note, or nominal semantic tree cannot substitute for the independently applicable navigation, interaction, announcement and visual-adaptation facts.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: asset-identity-variant-and-fallback-closure
          statement: Every material asset has a stable identity, immutable path and SHA-256 plus exact role, format, intrinsic size/aspect, density/platform/theme/mode/locale variants, color space and tintability, crop/focal point/mask rules, loading/placeholder/error/fallback behavior, licensing or provenance when required by Source, and a complete mapping to the subjects, conditions and facts that consume it. Missing variants, broken references, hidden critical values in a bitmap, or an asset that cannot be attributed to an implementation owner block ready handoff.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: method-specific-observation-and-oracle-closure
          statement: The verification catalog must provide a distinct attributable observation method wherever layout geometry, visual pixels, tokens, content/localization, component state, interaction/gesture/scroll/navigation, motion timeline, responsive/text reflow, input/IME, accessibility semantics/navigation/visual adaptation, system UI, haptic/sound feedback, or asset integrity cannot falsifiably share one oracle. Authoring must exercise every declared method against the frozen canonical source under every claimed cell and cross-check repeated facts; downstream production evidence must use the same exact fact identities on the current candidate, with deterministic environment inputs and declared comparison tolerance.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: fact-identity-and-proof-obligation-separation
          statement: A canonical Fact identity denotes one observable design predicate independently from its proof methods. Each Fact has one or more explicit Fact × verification-method obligations when its geometry, token resolution, visible pixels, semantics, interaction or other aspects require independent observers; the handoff and Long-Task evidence conserve that many-to-many relation. The system must neither duplicate one predicate into different pseudo-Facts merely to attach methods nor let one convenient method silently replace another required method.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: multi-subject-relation-fact-closure
          statement: "The Expected Fact Universe must represent multi-subject relations as first-class stable facts with typed endpoint roles: relative spacing or position, shared baseline/alignment, equal or proportional sizing, anchoring, containment, overlap/occlusion and z-order, synchronized state or motion, family/instance consistency and cross-Surface consistency cannot be attributed only to one arbitrary Subject. Removing an endpoint, relation or applicable condition must fail independently from the continued presence of each component's local properties."
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: frozen-inspector-census-and-capability-closure
          statement: The canonical manifest must bind the frozen Inspector implementation or named external TCB identity, version/digest, declared capability set, canonical entry and exact inspected input digests, and a complete addressable-node/resource/property census. Every discovered node, declaration, token, asset reference, relationship and supported custom property receives a Fact or an evidence-backed non-covered disposition; unreadable syntax, dynamic discovery beyond declared capability, an incomplete traversal or a changed Inspector/input identity blocks ready instead of accepting an Inspector-authored `complete` Boolean.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: design-system-effective-value-and-conflict-lineage
          statement: Style-bearing authoring must freeze the adopted design-system ID, revision and digest as manifest input and preserve each applicable value's lineage and precedence from base/alias token through semantic/component token, platform or mode override and instance/slot override to the resolved effective value. Repeated facts across design-system tokens, component specifications, HTML/CSS/JS/JSON/SVG and assets are cross-checked per Fact; conflicting values remain blocking until one authoritative source and rationale are selected, rather than letting file order or implementation code decide.
          required_proof_surfaces:
            - api_contract

          applicability_refs:
            - root-success
        - key: conditional-dynamic-and-virtualized-subject-closure
          statement: Subjects that are conditionally present, created/destroyed, lazy-loaded, virtualized/recycled, teleported through a Portal, rendered in an Overlay or System Surface, or repeated from data remain explicitly enumerable through stable family/instance/item identity and presence/visibility/lifecycle facts. List minimum/maximum/extreme data, pagination and refresh boundaries, reuse identity, scroll-position restoration and placeholder/error/fallback behavior must be specified where observable; absence from one captured tree or frame never removes the Subject from applicable states.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: units-rounding-input-configuration-and-time-semantics
          statement: Applicable numerical facts must declare coordinate space, logical/physical unit, precision and rounding or pixel-snapping conversion. Applicable input and time semantics must include keyboard/input type, return action, autocorrect/autocapitalization, input mask and secure-entry behavior, selection/cursor, clipboard/password-manager behavior, long-press/double-tap/debounce/throttle/timeout thresholds and latency-dependent feedback. A generic `px`, `keyboard`, `touch` or `loading` label cannot stand in for these independently observable values.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: formal-ready-handoff-fail-closed-boundary
          statement: A formal handoff may report `ready` only when there is no important in-scope UI/UX decision left for a developer to invent and every applicable observable fact is generated, readable, indexed, mapped, source-attributed and assigned a falsifiable method. Any `decision_required`, `unavailable`, unreadable or stale resource, unknown applicability, missing canonical dependency, unclosed condition/property universe, unsupported oracle capability, source conflict or unbound asset remains blocking. Exploration, deliberately partial constraints and historical resources remain usable only under their honest narrower interpretation; they cannot be relabeled as the new exact target or visual baseline.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: no-universal-opaque-resource-proof
          statement: This delivery does not claim to infer requirements absent from Source, derive unshown behavior from static media, semantically decode every future or hostile opaque design format, prove subjective taste, or mathematically attest an arbitrary external extractor or project oracle; those boundaries stay explicit and unresolved affected claims remain unfinished.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
      owner_surfaces: []
      controls: []
      control_relation_closure:
        state: not_applicable
        statement: This Outcome declares no user-visible Controls.
        applicability_refs:
          - root-success
      control_relations: []
      surface_bindings: []
      non_completing_outcomes:
        - key: integrity-is-not-completion
          statement: A successful design-resource preflight, complete fact inventory, immutable digest set, generated comparison artifact, focused test pass, targeted verification result, progress record, or prose review alone does not complete implementation; only the owning production checks and the applicable current-final-candidate closure may do so.
          applicability_refs:
            - root-success
    technical:
      obligations:
        - key: authoritative-comparator-tolerance-and-evidence-identity
          statement: Each per-Fact production result must bind its target condition and subject variation, actual-observation locator and digest, expected canonical locator and digest, comparator and parameters, exact mode or authoritative Fact-scoped tolerance/mask, derived verdict, frozen oracle identity and deterministic render/runtime environment identity. Tolerances and masks are Source/canonical authority, cannot be widened by implementation or hide unrelated regions, and expected data cannot be derived from the actual implementation. Sensitive actual values may remain in protected artifacts behind immutable locators/digests and structured comparison output, but a redaction policy cannot remove the Fact's attribution or falsifiability.
          required_proof_surfaces:
            - api_contract
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: nontruncating-scalable-universe-and-disposition-proof
          statement: Formal authoring and preflight may machine-generate, group, stream or chunk the fact universe and may use exact executable expansion/equivalence rules, but expansion must be deterministic and set-equal to the explicit atomic universe. No artifact-count, row-count, token, timeout or UI-size limit may silently truncate, sample, merge or summarize applicable facts; an exhausted capability fails with `unavailable`. Every `not_applicable`, `excluded_by_scope` and equivalence disposition binds the exact cells, Source/Inspector basis and rationale and is itself indexed and mutation-tested, so disposition labels cannot become a second omission channel.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: manifest-handoff-universe-set-equality
          statement: Preflight must derive and compare exact set equality for manifest resources/digests, subjects and hierarchy edges, standard axis dispositions and values, target conditions, subject variations, standard and custom property keys, applicable property cells, atomic facts/value locators, evidence, methods, blockers, assets and residual handoff projections. It must reject a narrowed manifest reference, missing subject/part/condition/variation/property/fact, orphan or duplicate row, ambiguous hierarchy, invalid value locator, unsupported custom property, circular self-declared resource closure, or handoff/manifest drift with the stable identity of the failing cell.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: expected-canonical-indexed-fact-universe-equality
          statement: "The formal preflight invariant is exact set equality: `Expected Fact Universe = Canonical Resource Facts = Handoff Indexed Facts`. The Expected Fact Universe is generated independently from the scoped subject/Anatomy hierarchy, first-class target-condition axes, first-class subject-local Variant/State/interaction-phase axes and closed atomic property catalog; Canonical Resource Facts are the Inspector-enumerated manifest facts backed by frozen typed value locators; Handoff Indexed Facts are the residual downstream projection. Component, part, Variant, State, text scale, Safe Area, density, platform and viewport identities must therefore be structured fields and cross-references, never encoded only inside a label, prose sentence, compound key or collection-name string."
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: single-authority-fact-projection
          statement: Canonical immutable design resources remain the sole owner of exact values; `design-resource-handoff-v1` owns only the fact index, resource closure, applicability, provenance, exclusions, blockers, and proof bindings; existing Product and Technical owners consume that projection, and the existing default Contract Conformance or Long-Task Final Gate remains the mutually exclusive sole closure carrier, with no second design Authority, fact-value source, Contract, Gate, registry, lifecycle state, scheduler, or implementation-order constraint.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: machine-enforced-fact-schema
          statement: The unreleased V1 handoff parser, strict shape, source-profile and file validation, coverage validator, CLI result, public types, and fixtures must fail closed on absent or unknown fact fields, non-atomic fact applicability, incompatible evidence or methods, incomplete resource closure, unreferenced facts, resources or evidence, and exact-target layout or pixel omissions while preserving the existing eight-dimension and source/dependency/digest/locator protections.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: contract-and-evidence-fact-binding
          statement: Long-Task Contract schema, parser, compiled authority, revision material, design-target method bindings, typed `design_method` evidence, Playwright projection, runtime decoder, and final evidence validation must freeze one canonical `fact_expectations` entry for every Fact × required-method obligation and compare it with exactly one current `fact_results` entry carrying actual observation/environment/comparison/verdict. Resource hashes, a generic screenshot, method presence, aggregate success, or a fact-free record cannot satisfy that binding.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: per-fact-native-evidence-verdict
          statement: Every Long-Task `design_method` current-execution record must carry one typed result for each and only each expected `fact_ref`. Each result binds the actual observation, expected/comparison target and comparison result, applicable tolerance or explicit exact-comparison mode, pass/fail verdict, and immutable oracle identity/version/digest or named external-runtime TCB identity. The decoder and Final Gate must reject a missing/extra/duplicate Fact result, aggregate-only method Boolean, absent observation/comparison/tolerance/oracle identity, failed Fact, reused indistinguishable observation, or oracle/tolerance drift even when the enclosing method record claims success.
          required_proof_surfaces:
            - api_contract
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: antidegradation-admission-proof
          statement: The mechanism change must establish `Coverage_new ⊇ Coverage_old`, `FalseNegative_new ⊆ FalseNegative_old`, non-bypassable Authority and fail-closed handling, and complete-current-final-snapshot proof before cost is considered; executable counterexamples must reject the current coarse declared-cell false green and the missing-pixel-method false green, one reviewed critical sentinel must protect the new path, and the existing causal-chain and Implementation Freedom Boundary sentinels must remain passing.
          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
        - key: distribution-context-and-cost-closure
          statement: Stable semantics and actual owners must remain aligned across PROJECT_SPEC, owning Context and implementation index, shared and managed Skills, generated workspace copies, package assets, all public README surfaces, source mappings, affected and Trust routing, focused tests, complete package tests, source parity, Context validation, and Harness validation; the change adds no runtime state or extra production Gate, and grouped machine-authored fact rows keep incremental authoring and execution cost proportional to selected resource facts.

          required_proof_surfaces:
            - api_contract
          applicability_refs:
            - root-success
