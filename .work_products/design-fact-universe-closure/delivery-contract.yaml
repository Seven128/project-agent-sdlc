              criterion: Given one Long-Task method × condition evidence cell containing multiple expected facts, when its node-oracle or Playwright result is decoded and Final Gate runs, then the `fact_results` set equals the bound `fact_refs` and every row has attributable actual observation, comparison, tolerance/exact mode, passing verdict and current oracle identity; deleting one row, replacing rows with one aggregate pass, changing a Fact to failed, reusing an indistinguishable observation, or changing the oracle/tolerance without Authority Revision keeps the relevant Assertion and delivery unfinished.
