            - key: relation-dynamic-and-multimethod-ac
              criterion: Given related component instances, one conditional Anatomy Part, a virtualized repeated item and one Fact requiring both token and pixel proof, when the universe and handoff compile, then the relation endpoints, conditional presence/lifecycle, family/item identity and both Fact × method obligations are independently indexed; collapsing the relation into one endpoint, dropping the hidden/lazy state, treating one captured item as the population or replacing two methods with one each fails closed.
