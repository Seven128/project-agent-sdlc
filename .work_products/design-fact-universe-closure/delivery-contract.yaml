              criterion: Given multiple per-Fact Long-Task results including a legitimate platform raster tolerance and a protected sensitive observation, when evidence is decoded, then actual/expected locators and digests, comparator, authoritative Fact-scoped tolerance or exact mode, verdict, oracle and environment identities all match Authority and every Fact passes. An aggregate Boolean, implementation-generated expected value, widened/global mask, missing sensitive actual lineage, stale oracle/environment, failed comparison or reused result fails the corresponding Assertion.
