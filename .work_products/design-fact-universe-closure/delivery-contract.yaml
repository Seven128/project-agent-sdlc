              expected: true
            - key: manifest-universe-mutation-ac
              criterion: Given a canonical manifest and residual handoff that close multiple nested subjects, target conditions, subject-local variations, property keys, value locators and assets, when preflight runs, then the complete pair passes; independently deleting or narrowing a Surface, region, component instance, Anatomy Part, parent/instance edge, condition axis/value/combination, Variant, State, interaction phase, standard property cell, atomic fact, locator, resource digest, asset mapping or blocker fails closed even when the residual eight-dimension rows remain internally self-consistent.
