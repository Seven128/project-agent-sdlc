              criterion: Given a ready formal handoff, when Default or Long-Task consumes it, then every manifest-backed atomic fact—including component-part geometry/style, platform/locale/text-scale/accessibility variants, gestures/motion/haptic behavior and asset identity—retains one production owner, target condition, subject variation, verification method and current-candidate observation; removal, substitution, grouping that loses attribution, unsupported target capability, stale comparison environment or a self-generated visual baseline blocks complete conformance without adding another Gate.
