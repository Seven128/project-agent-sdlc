              criterion: Given a machine-generated universe larger than one authoring chunk with applicable and genuinely non-applicable cells, when generation and preflight run, then deterministic expansion across all chunks equals the atomic Expected Universe and every N/A/exclusion/equivalence row has exact Source/Inspector basis; truncating at a row/token/time limit, replacing the remainder with a summary, sampling, mislabeling covered cells as N/A or using prose equivalence fails ready with the first missing or invalid cell identity.
