            - key: expected-canonical-indexed-fact-universe-equality
              criterion: "The formal preflight invariant is exact set equality: `Expected Fact Universe = Canonical Resource Facts = Handoff Indexed Facts`. The Expected Fact Universe is generated independently from the scoped subject/Anatomy hierarchy, first-class target-condition axes, first-class subject-local Variant/State/interaction-phase axes and closed atomic property catalog; Canonical Resource Facts are the Inspector-enumerated manifest facts backed by frozen typed value locators; Handoff Indexed Facts are the residual downstream projection. Component, part, Variant, State, text scale, Safe Area, density, platform and viewport identities must therefore be structured fields and cross-references, never encoded only inside a label, prose sentence, compound key or collection-name string."
