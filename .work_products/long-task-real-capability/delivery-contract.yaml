        - key: purpose-validity-floor-before-relative-antidegradation
          statement: 机制开发准入顺序必须是：在明确威胁模型与 TCB 内的声明目的有效性下限 → 相对非劣化 → 有效候选不被误阻 → 总成本与 ROI。有效性下限至少要求冻结关键反例全部被拒绝、正确控制组全部通过、没有未关闭的已知 critical false acceptance、能力声明不超过证据支持范围；它不是“绝对正确”机器状态，也不得成为消费者 Long-Task 的新 Gate、状态、Authority 或 registry。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - assurance-governance-current-success
        - key: invalid-baseline-and-claim-downgrade
          statement: 发现 current `main` 的 critical false-completion path 后，错误行为被标记为 defect，不属于需要保留的有效 Coverage；相关高水准能力声明立即降级，反例先进入固定威胁集，候选必须证明旧版接受且修复版拒绝。在回归、可信观察闭环和要求的真实回放完成前，不得以旧测试绿色、总体逻辑、文档禁止或项目 verifier 写错为由维持原声明。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - assurance-governance-current-success
        - key: coverage-defined-by-rejected-attack-surface
          statement: 防劣化 Coverage 表示机制能拒绝的已知错误完成路径集合，不以测试文件数、Assertion 数、Fact 数、哨兵名称或 CI 绿色计数代替。相对比较只能使用已证明有效的 baseline：`Coverage_new` 不少于有效 baseline，false-negative resistance、false-positive behavior、Authority、freshness 与 fail-closed 不得变弱；选择一个允许方案不删除其他仍受支持的允许成员。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - assurance-governance-current-success
        - key: critical-sentinel-positive-negative-controls
          statement: 每个高层 critical sentinel 至少绑定：一个正确候选通过；一个直接违反该能力的错误候选失败；独立于被测 verifier 的 ground truth；修改真实生产语义的 mutation；在声明 owner/Fact/Assertion 边界的预期定位；以及证明合法共享执行、容差、mask 和动态值不会被误阻的控制组。继续复用 `CRITICAL_TEST_SENTINELS`，不新增第二 registry。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - assurance-governance-current-success
        - key: incident-counterexample-first-rule
          statement: 任何真实的明显需求违背、selected-design 漂移、历史证据冒充当前证据、verifier 自证或 Final Gate 近似错误接受，必须先形成能在旧版复现的最小负向 fixture，再修改实现；修复后证明旧版接受、当前版拒绝，且失败落在声明的语义 owner。开放 critical counterexample 自动降级对应能力声明。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - assurance-governance-current-success
        - key: sentinel-rationale-evidence-bounded
          statement: 现有 critical sentinel rationale 和测试策略描述不得超过实际正负控制证明的范围。`selected-design-exact-verdict-recomputation` 应强化现有 semantic-drift-closure 测试和现有 registry 项，不必新建测试文件；如果测试只证明 exact digest 重算，就不得声称已证明任意 observer、任意 UI 格式或完整 live-session 真实性。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - assurance-governance-current-success
        - key: capability-claim-levels
          statement: 正式开发与发布结论只使用四级能力表述：已设计；已实现；已建立已知反例保护；在明确 TCB 内已高水准实现设计目的。最高级必须同时具备明确支持范围/TCB、Source 与投影闭包、独立当前 actual、Harness 重算 verdict、关键攻击全拒绝、正确控制组通过、黑盒 Final Gate、至少一个真实或脱敏真实项目回放、无开放 critical counterexample 和机制 ROI 准入。GPT、Codex、人工 prose 审计、文档声明、测试数量或单次 benchmark 都不能提升等级。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - assurance-governance-current-success
        - key: approved-final-capability-wording
          statement: 只有全部硬验收成立后，正式能力表述才可恢复为：Long-Task Workflow 在完整、准确的声明范围、预期细粒度和已准入观察/TCB 内，允许模型在中间理解、实现和修复中自然发生漂移、遗漏或幻觉；但 Source→Contract 的声明内语义遗漏、准入 observer 能发现的当前生产差异、历史或代理证据、自证式 actual、错误 comparison/verdict 及未证明边界，不能进入最终 `machine_accepted`。对于无法建立可信机器观察的事实，工作流保持未完成或 External Confirmation。该表述不声称覆盖未表达意图或 TCB 外任意行为。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - assurance-governance-current-success
