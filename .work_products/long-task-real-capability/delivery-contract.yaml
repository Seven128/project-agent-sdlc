    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.material-input-provenance
  - key: declared-assurance-theorem
    source_ref: docs/long-task-real-capability-closure.md
    statement: 目标机器定理限制在完整准确的声明范围、预期细粒度、机器索引的 Fact×条件×方法宇宙和明确的 package-admitted TCB 内：`machine_accepted` 只能由未漂移 expected Authority、当前 package actual、Harness comparison/verdict、可归因 production carrier 或 direct process root、因果 Counterfactual 和当前 Final Gate 快照共同推出；unsupported obligation 必须保留为阻断型 External Confirmation。当前交付仅声明已保护已知反例的 Level 3，不把待独立审计的目标定理当作已经自证成立。
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.declared-assurance-theorem
  - key: assurance-causal-chain
    source_ref: docs/long-task-real-capability-closure.md
    statement: 完成链保持单向：完整准确 Source Authority → 无遗漏保义的细粒度 Fact 投影 → Fact×适用条件×所需方法闭包 → package static pre-run carrier 或 Harness 直接启动的 process product root 所产生的当前 actual → `evaluateExactDigestComparison(...)` 重算 comparison/result identity/verdict → admitted baseline/mutated actual 的因果 Counterfactual → 同一当前快照的唯一 Final Gate。代码、项目 verifier、项目 v3 actual/pass/verdict/runtime/interaction/state 记录、历史 Receipt 或 prose 都不能反向成为 expected 或 terminal Authority。
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.assurance-causal-chain
  - key: known-selected-design-false-acceptance
    source_ref: docs/long-task-real-capability-closure.md
    statement: 历史 critical false-acceptance 是 selected-design `exact_value + exact` 路径曾接受 actual digest 与 expected digest 不同但项目自报 `passed` 的候选。该事故已被 owner-local exact evaluator 与 V1/V2 负向回归关闭，现作为冻结反例保留；它不能再被描述为当前开放漏洞，也不能单独证明 observer、生产可达性或 Level 4。
    disposition:
      type: risk_fact
      refs:
        - critical_user_path:p0-exact-recomputation
  - key: p0-positive-fixture-correction
    source_ref: docs/long-task-real-capability-closure.md
    statement: selected-design 正确控制的 actual digest 必须等于 expected digest；mismatch 只能出现在独立负向控制中并由 Harness exact owner 拒绝。该边界已由当前 V1/V2 fixture 与共享 evaluator 回归保护，仍需独立审计确认本次整体能力声明没有超出测试范围。
    disposition:
      type: claim
      refs:
        - p0-exact-recomputation.requirement.p0-positive-fixture-correction
  - key: p0-v1-negative-control
    source_ref: docs/long-task-real-capability-closure.md
    statement: V1 ground 负向控制固定 `actual != expected` 且项目提交 `comparison.passed = true`、`verdict = passed` 的攻击，Harness 必须在共享 exact comparison/result identity owner 拒绝，ground truth 不由项目 verifier 生成。
    disposition:
      type: claim
      refs:
        - p0-exact-recomputation.requirement.p0-v1-negative-control
  - key: p0-v2-negative-control
    source_ref: docs/long-task-real-capability-closure.md
    statement: V2 symbolic 负向控制与 V1 同构：Rule/region actual digest 与 frozen expected 不同而项目自报通过时必须拒绝，同时保持 V2 Rule、region、certificate identity 和 extensional closure 的既有约束。
    disposition:
      type: claim
      refs:
        - p0-exact-recomputation.requirement.p0-v2-negative-control
  - key: shared-exact-comparison-owner
    source_ref: docs/long-task-real-capability-closure.md
    statement: V1 ground、V2 symbolic、non-UI semantic Fact、static observer 与 process observer 全部复用 `evaluateExactDigestComparison(...)` 及其 result-identity owner；exact 只允许 exact mode，tolerance/mask 为空，actual 与 expected 不等即失败，项目 `passed`/`verdict` 仅为可选诊断副本且不一致时 fail closed。
    disposition:
      type: claim
      refs:
        - p0-exact-recomputation.requirement.shared-exact-comparison-owner
  - key: p0-owner-local-and-v3-compatible
    source_ref: docs/long-task-real-capability-closure.md
    statement: P0 没有为局部 exact 修复发布 v4；公共项目结果仍为 v3，新的产品 observation 使用独立 `ty-context-product-observation-v1` stdout envelope，权威 observation/comparison/runtime attestation 留在 Harness 内部。未来只有跨进程表达新的 browser/native session authority 等无法由当前边界保义承载时才评估 v4。
    disposition:
      type: claim
      refs:
        - p0-exact-recomputation.requirement.p0-owner-local-and-v3-compatible
  - key: p0-verification-boundary
    source_ref: docs/long-task-real-capability-closure.md
    statement: P0 的 focused exact mismatch、V1/V2 控制、critical sentinel、Trust 与 package regression 只能证明对应 exact owner 的已知反例保护；不得据此把 self-delivery 当前候选提升到 Level 4。整体 Level 4 仍需独立能力审计和真实 process workload ROI。
    disposition:
      type: claim
      refs:
        - p0-exact-recomputation.requirement.p0-verification-boundary
  - key: purpose-validity-floor-before-relative-antidegradation
    source_ref: docs/long-task-real-capability-closure.md
    statement: 机制开发准入顺序必须是：在明确威胁模型与 TCB 内的声明目的有效性下限 → 相对非劣化 → 有效候选不被误阻 → 总成本与 ROI。有效性下限至少要求冻结关键反例全部被拒绝、正确控制组全部通过、没有未关闭的已知 critical false acceptance、能力声明不超过证据支持范围；它不是“绝对正确”机器状态，也不得成为消费者 Long-Task 的新 Gate、状态、Authority 或 registry。
    disposition:
      type: claim
      refs:
        - assurance-governance.requirement.purpose-validity-floor-before-relative-antidegradation
  - key: invalid-baseline-and-claim-downgrade
    source_ref: docs/long-task-real-capability-closure.md
    statement: 发现 current `main` 的 critical false-completion path 后，错误行为被标记为 defect，不属于需要保留的有效 Coverage；相关高水准能力声明立即降级，反例先进入固定威胁集，候选必须证明旧版接受且修复版拒绝。在回归、可信观察闭环和要求的真实回放完成前，不得以旧测试绿色、总体逻辑、文档禁止或项目 verifier 写错为由维持原声明。
    disposition:
      type: claim
      refs:
        - assurance-governance.requirement.invalid-baseline-and-claim-downgrade
  - key: coverage-defined-by-rejected-attack-surface
    source_ref: docs/long-task-real-capability-closure.md
    statement: 防劣化 Coverage 表示机制能拒绝的已知错误完成路径集合，不以测试文件数、Assertion 数、Fact 数、哨兵名称或 CI 绿色计数代替。相对比较只能使用已证明有效的 baseline：`Coverage_new` 不少于有效 baseline，false-negative resistance、false-positive behavior、Authority、freshness 与 fail-closed 不得变弱；选择一个允许方案不删除其他仍受支持的允许成员。
    disposition:
      type: claim
      refs:
        - assurance-governance.requirement.coverage-defined-by-rejected-attack-surface
  - key: critical-sentinel-positive-negative-controls
    source_ref: docs/long-task-real-capability-closure.md
    statement: 现有 `CRITICAL_TEST_SENTINELS` 复用四个唯一 canonical 边界：`observer-admission-no-bypass` 对应 R1，`static-carrier-pre-run-freeze` 对应 R7b，`host-derived-target-runtime` 对应 R3，`counterfactual-production-observation-impact` 对应 R8。每个 sentinel 必须绑定准确的正/负控制、真实 owner、完整 runtime 路径和明确的不证明内容；不得用 tolerance/mask、native/UI 或字符串存在性扩大 rationale。
    disposition:
      type: claim
      refs:
        - assurance-governance.requirement.critical-sentinel-positive-negative-controls
  - key: incident-counterexample-first-rule
    source_ref: docs/long-task-real-capability-closure.md
    statement: 任何真实的明显需求违背、selected-design 漂移、历史证据冒充当前证据、verifier 自证或 Final Gate 近似错误接受，必须先形成能在旧版复现的最小负向 fixture，再修改实现；修复后证明旧版接受、当前版拒绝，且失败落在声明的语义 owner。开放 critical counterexample 自动降级对应能力声明。
    disposition:
      type: claim
      refs:
        - assurance-governance.requirement.incident-counterexample-first-rule
  - key: sentinel-rationale-evidence-bounded
    source_ref: docs/long-task-real-capability-closure.md
    statement: critical sentinel 的 rationale 只能覆盖其 canonical 黑盒反例与正确控制实际证明的 owner 边界；固定 test ID、workflow terminal 和 wrong/control 对照必须来自当前 invocation 的独占 machine report，不能由 aggregate Boolean、命令 exit 0 或源码 token 存在替代。
    disposition:
      type: claim
      refs:
        - assurance-governance.requirement.sentinel-rationale-evidence-bounded
  - key: capability-claim-levels
    source_ref: docs/long-task-real-capability-closure.md
    statement: 正式结论保持四级：Level 1 已设计、Level 2 已实现、Level 3 已建立声明内已知反例保护、Level 4 在明确 TCB 内高水准实现设计目的。当前候选最多为 Level 3；只有 `independent-capability-audit` 和 `real-process-workload-roi` 都完成、无开放 critical counterexample 且 Source/Contract 显式修订后才可进入 Level 4。GPT/Codex/人工 prose、文档、绿测数量、旧 Receipt 或 fresh-agent 汇总都不能自行提升等级。
    disposition:
      type: claim
      refs:
        - assurance-governance.requirement.capability-claim-levels
  - key: route-b-project-owner-decision
    source_ref: docs/long-task-real-capability-closure.md
    statement: 项目 owner 继续选择路线 B：普通模型编写 verifier 的错误、自报 actual/verdict/runtime、历史 session、代理 target 和纯 evidence carrier 属于威胁模型。首版实现只准入 package static JSON exact 与 package direct-process JSON exact；其他 observer 诚实进入 External Confirmation，不以保留 custom Oracle 的机器兼容换取表面兼容。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.obligation.route-b-project-owner-decision
  - key: observation-channel-authority
    source_ref: docs/long-task-real-capability-closure.md
    statement: machine obligation 只允许两类 package-admitted 当前 Actual：A）runner 前已存在且在全部 raw execution 前统一冻结、runner 后 identity/digest 未变化的 static UTF-8 JSON exact carrier；B）Harness 在隔离 runtime-closure snapshot 中直接启动 `process/product/root` 并从 bounded stdout 捕获的 `ty-context-product-observation-v1` exact envelope。其他 custom/named project Oracle、wrapper、browser/native/device/layout/pixel/a11y/motion、protected/tolerance/mask/custom locator 都必须 External Confirmation。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.requirement.observation-channel-authority
  - key: expected-actual-comparison-verdict-ownership
    source_ref: docs/long-task-real-capability-closure.md
    statement: Expected 由 Source/Context/canonical resource/Contract 持有；Actual 由 package static 或 direct-process adapter 持有；comparison/result identity/verdict 由 Harness exact owner持有；terminal 只由当前快照 Final Gate 持有。项目 runner 只能启动产品、提供输入/诊断或提交兼容 v3 副本，不能拥有 authoritative actual、passed、verdict、target-runtime authenticity、interaction、state 或 production reachability。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.obligation.expected-actual-comparison-verdict-ownership
  - key: bounded-admitted-artifact-contract
    source_ref: docs/long-task-real-capability-closure.md
    statement: static 首版只支持 pre-existing unchanged UTF-8 JSON、RFC 6901 JSON Pointer、plain `exact_value + exact` 与既有 size/depth/pointer/canonical JSON/no-follow 限制；它只证明当前结构/config carrier 内容。process 首版只支持 `runtime_family=process`、`role=product`、direct root entrypoint、plain exact JSON stdout；一个 raw execution 的一个 bounded envelope可承载多个 obligation identity，extra/missing identity 均拒绝。两类都不扩张为通用 UI/native observer。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.requirement.bounded-admitted-artifact-contract
  - key: actual-artifact-reextraction
    source_ref: docs/long-task-real-capability-closure.md
    statement: static adapter 从 runner 前冻结且 runner 后未变的 carrier 重新提取 JSON Pointer 值并摘要；process adapter 从 Harness 捕获的产品 root stdout envelope 重新提取 actual。两者都调用共享 exact evaluator，并拒绝项目提交 actual/pass/verdict 与 Harness 结果不一致；不能直接绑定该静态对象或 root exact JSON 输出面的 Claim 必须 External Confirmation。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.requirement.actual-artifact-reextraction
  - key: challenge-is-freshness-only
    source_ref: docs/long-task-real-capability-closure.md
    statement: direct-process adapter 不向 child 暴露 output path、challenge、protocol 或 Harness 专用环境变量；Harness 仅在 host attestation 内持有一次性内部 nonce，并从受限 stdout 捕获唯一 envelope。nonce 只绑定一次执行 freshness，不证明 root 语义、session 真实性或 observer soundness；真实性还依赖直接 root、隔离 closure、pre/post freeze、package extraction、exact comparison 与 Counterfactual。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.requirement.challenge-is-freshness-only
  - key: generated-carrier-semantic-role
    source_ref: docs/long-task-real-capability-closure.md
    statement: 纯 evidence/report/status/comparison/Receipt/verifier output/历史 session 不能成为 production carrier。静态生成配置只有在 Final Gate 前已存在于 candidate snapshot、属于声明 Binding carrier 且 runner 未修改时才可证明该结构本身；运行时生成物只有通过 direct-process root 的 package observation 和 Counterfactual actual-change 才能证明 production reachability。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.requirement.generated-carrier-semantic-role
  - key: expected-to-actual-self-proof-rejection
    source_ref: docs/long-task-real-capability-closure.md
    statement: Expected/Source/Contract/Context/canonical resource、verification input 和 evidence/report/status 路径不能充当 Actual；custom Oracle 或项目 wrapper 不能关闭 machine Claim。static carrier 必须 pre-existing unchanged，process actual 必须来自 Harness 直接启动的产品 root stdout，项目 v3 actual/pass/verdict/runtime 只作诊断副本。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.requirement.expected-to-actual-self-proof-rejection
  - key: production-reachability
    source_ref: docs/long-task-real-capability-closure.md
    statement: 静态 observation 只证明被观察结构/config 对象的当前内容，不自动证明运行时消费。runtime production reachability 只由 `Harness mutation → 重新 prepare/freeze 隔离 closure → 直接启动同一 product root → package 捕获对应 actual 改变` 建立；Binding/input 路径声明、synthetic status、generated evidence 或 verifier wrapper 均不足。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.requirement.production-reachability
  - key: counterfactual-actual-change-and-impact-set
    source_ref: docs/long-task-real-capability-closure.md
    statement: machine Counterfactual 必须同时拥有合法 baseline 与 mutated package observation，且 obligation universe 完全相同；expected affected Facts 必须变化，preserved Facts 与 target liveness 不得变化，其他变化只能属于显式 allowed fan-out。没有 admitted observation 时不得跳过；static 只证明结构，process 必须重新执行同一 direct root。当前 self-delivery 的所有 semantic Counterfactual 都明确交由 External Confirmation，不用项目 verifier 自证。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.requirement.counterfactual-actual-change-and-impact-set
  - key: selected-design-existing-owner-preservation
    source_ref: docs/long-task-real-capability-closure.md
    statement: 本 Goal 不重建设计 Fact 类型体系。继续复用现有 Expected/Canonical/Handoff 集合闭包、Fact×method、property→required methods、exact-target layout/pixel、Anatomy、relation、条件空间、V1/V2 identity 和 Final Gate fact_results owners；攻击用例应定位“现有规则未执行”或“证据被错误信任”的位置。资源 preflight 只证明输入完整性，不能代替 production conformance；reference/constraint 的 production 投影和 Fact-method compatibility 继续由既有 owners 承担。
    disposition:
      type: claim
      refs:
        - p0-exact-recomputation.requirement.selected-design-existing-owner-preservation
  - key: no-universal-ui-observer
    source_ref: docs/long-task-real-capability-closure.md
    statement: 本轮不建设 browser/native/device、布局、像素、无障碍树、motion timeline、OCR 或任意 custom locator 的通用观察框架，也不把产品自定义 instrumentation 映射成任意内部/UI事实后冒充 package observer。无法把 Claim 直接绑定 pre-existing static JSON 结构或 direct product root 的 exact JSON stdout surface 时，必须保留阻断型 External Confirmation。
    disposition:
      type: global_constraint
      refs:
        - non_goal.no-universal-ui-observer
  - key: v3-v4-and-migration-rule
    source_ref: docs/long-task-real-capability-closure.md
    statement: 公共 project result 保持 `long-task-check-result-v3`，同名 actual/pass/verdict/target_runtime/interaction/state/design records 全部降为诊断或一致性副本；产品 direct-process 输出使用独立 `ty-context-product-observation-v1` bounded stdout envelope，child 不接收 output/challenge/protocol env。TCB 与 Compile policy 变化要求重新 Compile/Authority Revision，旧 Progress/Receipt 不可复用；未来 browser/native session handle 确需跨进程权威表达时再单独裁决 v4。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.requirement.v3-v4-and-migration-rule
  - key: attack-suite-ground-truth
    source_ref: docs/long-task-real-capability-closure.md
    statement: 当前 Level 3 黑盒集合固定为 21 个 case，其中 18 个 wrong candidate 均被拒绝：R1 custom Oracle expected-as-actual、R1b Expected/verification input 充当 static actual、R2 runner 新建 static carrier、R3 历史 target-runtime 自证、R4 browser 代理 native、R5 synthetic status Binding、R5b evidence-role static carrier、R5c direct-process evidence-role carrier、R6 verifier wrapper、R6b argv wrapper、R7 runner 修改 frozen carrier、R7b cross-execution priming、R7c process input mutation、R8 Counterfactual mutated observation 缺失，以及 R9 non-carrier evidence input、R10 non-carrier verification input、R11 Source-wrong product root 与 R11b 未绑定 repository argv 文件。R9–R11 及 R11b 已在当前 owner 修复；每个 case 使用固定 ID、真实 Contract→runner→admission→Counterfactual→Final Gate 路径与独立 terminal report，Compile-time 攻击还必须以合法近邻 Authority 获得 Final-Gate 拒绝，不得以内层 policy error、`active_task_missing` 或 aggregate Boolean 代替。
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.attack-suite-ground-truth
  - key: valid-control-suite
    source_ref: docs/long-task-real-capability-closure.md
    statement: 三个正确控制组固定为：pre-existing 且 runner 前后 unchanged 的 static JSON structure 达到 `machine_accepted`；Harness 直接启动 process product root，在同一 Raw Execution/envelope 中承载多个显式 Fact 及 cross-Check implicit-preserved Fact，并在合法 Counterfactual 中观察 affected/preserved/allowed-fan-out 关系，达到 `machine_accepted`；unsupported target-blocking control 保留 `blocked_external` 而绝不 machine-accept。普通历史文件仅作诊断时不误阻。
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.valid-control-suite
  - key: black-box-final-gate-lifecycle
    source_ref: docs/long-task-real-capability-closure.md
    statement: 能力安全证据读取当前 invocation 独占临时路径中的 Node machine report：固定 case ID、candidate role、workflow terminal、expected relation、wrong case 的 control_case_id、reporter pass/skip/fail 计数必须集合完整、无重复且相互一致。每个 wrong terminal 必须与正确 static/process 或 external-pending control 按边界配对；Compile-time 攻击同时保留 owner diagnostic 和合法近邻 Authority 的 Final-Gate 拒绝，`active_task_missing` 不算能力证明。源码 `contains(token)`、命令 exit 0、汇总 Boolean、旧 report/Receipt 都不能生成 runtime capability actual。该证据支持 Level 3，不能代替独立审计。
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.black-box-final-gate-lifecycle
  - key: starward-sanitized-replay
    source_ref: docs/long-task-real-capability-closure.md
    statement: 现有 Starward 材料只能证明脱敏 fixture 内部形态与回放规则，不包含可独立核验的原事故设计源、生产截图、运行证据或明确的“原事故事实→脱敏 fixture”映射，因此不得声称真实事故覆盖率或以它恢复 Level 4。未来补齐原始材料时必须作为新的受控外部证据审查。
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.starward-sanitized-replay
  - key: fresh-agent-benchmark-boundary
    source_ref: docs/long-task-real-capability-closure.md
    statement: 现有 fresh-agent 汇总只能条件性说明 authoring 遵循率与局部 ROI；五组原始 pair report、aggregate report 的独立原始 JSONL trace、评分过程及 model/provider identity未完整保留，因而不能用于安全定理、零假阳性或高置信度实验结论。后续 benchmark 只测 machine/external 选择、authoring token、诊断修复轮数、wall time 与 false blocking。
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.fresh-agent-benchmark-boundary
  - key: roi-admission-order
    source_ref: docs/long-task-real-capability-closure.md
    statement: ROI 必须在目的有效性与 valid-control 非劣化之后评估。仓库已实现 `examples/delivery-benchmark/real-process-workload/**` 的 8-Fact normal/degraded 真实 process workload、两个 Counterfactual、独立 semantic gold，以及 A legacy self-report、B `808efa9e` isolated envelope、C clean final candidate 的收集/评分/复算 owner。但 authentic A/B/C collection 仍等待干净已提交的 final C，`authoring_token_count` 仍必须来自 invocation-bound host/provider usage event；缺失时是 `required-unverified`，不接受 surrogate tokenizer，也不得得出正 ROI 或 Level 4。旧 fresh-agent 汇总和 Starward fixture 不承担该结论。
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.roi-admission-order
  - key: early-real-entry-feedback
    source_ref: docs/long-task-real-capability-closure.md
    statement: 真实入口早期反馈仍是风险收益合适时的建议诊断，不是新 Gate 或 machine proof。当前 browser/native/layout/visual 不具备 package observer，任何真实 UI 入口结果都必须由 External Confirmation承载，不能从 direct-process stdout instrumentation 推导任意内部/UI事实。
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.early-real-entry-feedback
  - key: no-new-lifecycle-authority-registry
    source_ref: docs/long-task-real-capability-closure.md
    statement: 实现继续复用现有 Source、Contract、Compile、Evidence Kernel、Counterfactual、Final Gate、External Confirmation、Trust Boundary Gate 与 `CRITICAL_TEST_SENTINELS`；compiled observation authority 是投影而不是第二 Authority/registry。本轮没有新增 Gate、状态机、调度器、持久 challenge/session 或 per-edit validation。
    disposition:
      type: claim
      refs:
        - assurance-governance.obligation.no-new-lifecycle-authority-registry
  - key: owner-dependency-lifecycle-boundary
    source_ref: docs/long-task-real-capability-closure.md
    statement: "`long-task-observation-authority.ts` 编译 machine/external plan，`long-task-process-runtime-closure.ts` 绑定 Source-backed root、完整 argv 与 production carriers，`long-task-execution-observation.ts` 执行全 universe prepare-all→execute/finalize，`long-task-static-observation-freeze.ts` 统一 no-follow pre/post identity+streaming digest freeze，`long-task-process-observation.ts` 解码 bounded stdout envelope，`long-task-exact-comparison.ts` 唯一计算 exact/result identity，Final Gate 保持 terminal owner。声明稳定的 exact `planned` root/argv/carrier 可在 Preflight/Compile 时尚未生成，但 Final Gate 必须要求其当前实体；兼容 Checks 复用同一 Raw Execution/envelope，cross-Check implicit-preserved Fact 仍保留独立 obligation/result identity。Expected 不进入 runtime closure，observer 不拥有 expected，失败显式且临时 snapshot/process/artifact 有界清理。"
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.obligation.owner-dependency-lifecycle-boundary
  - key: harness-package-runtime-execution-target
    source_ref: docs/long-task-real-capability-closure.md
    statement: 'Execution target authority: {"capabilities":["cold-start","process-runtime","production-root"],"key":"harness-package-runtime","role":"product","root_argv":[],"root_entrypoint":"packages/ty-context/dist/cli.js","runtime_family":"process"}.'
    disposition:
      type: claim
      refs:
        - execution_target.harness-package-runtime
  - key: build-reuse-buy-allowed-set
    source_ref: docs/long-task-real-capability-closure.md
    statement: 本轮选择复用现有 snapshot manifest、raw execution identity、Counterfactual sandbox、JSON Pointer/canonical JSON limits、External Confirmation 与 Final Gate owners，并以标准库实现有界 streaming digest、隔离 closure复制、direct spawn/stdout capture 和 host attestation；没有引入通用 observer framework 或新依赖。禁止重复 exact owner、把 project verifier置回 TCB、无限缓冲 stdout、按 raw group重复无界预算或复制 Expected/verification 全闭包。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.obligation.build-reuse-buy-allowed-set
  - key: technical-debt-and-future-change
    source_ref: docs/long-task-real-capability-closure.md
    statement: 已关闭 non-UI/selected-design/static/process 多条 exact equality 分叉，统一到共享 evaluator；已关闭 raw group 顺序导致 cross-group priming 的冻结空窗。剩余有意边界是只支持 static/process plain exact JSON，interaction_trace/state_delta/design_conformance尚无 package derivation，browser/native/UI 与恶意 OS sandbox escape不在首版机器证明内，均通过 External Confirmation而非第三条自证路径管理。
    disposition:
      type: claim
      refs:
        - p0-exact-recomputation.obligation.technical-debt-and-future-change
  - key: compatibility-security-resource-boundaries
    source_ref: docs/long-task-real-capability-closure.md
    statement: direct-process 在 runner 前复制 Source-backed root executable、完整 argv 中可归因仓库文件与 production carrier refs 到隔离 runtime-closure snapshot，并以全 universe 共享预算做 streaming pre/post identity+digest；不会因 `input_paths`、manifest/glob sibling 或任意 verification/frozen_files 而扩大 closure，Source/Contract/Context 也不进入 closure。child 环境最小化、stdout 有界、process tree 被监测清理；prepare-all watcher/pre-post 检查、process containment/cleanup 的 subtraction review 仍保留，移除任一项都必须使冻结控制失败。这不是绝对恶意代码沙箱：host OS/filesystem/process API、Node runtime 与进程枚举/终止仍属于 TCB，超出该攻击边界需独立 sandbox 与 External Confirmation。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.obligation.compatibility-security-resource-boundaries
  - key: context-and-public-authority-update
    source_ref: docs/long-task-real-capability-closure.md
    statement: "本轮 `Context Delta: required` 已由 owning Context、PROJECT_SPEC、mechanism-admission/test governance、managed Skill 与中英文公共文档记录：package static/process exact范围、stdout隔离、host runtime、Counterfactual、unsupported external、Level 3 与 OS/process containment TCB。Source/Contract 必须与这些 owner一致，旧 canonical compiled/progress/receipt只作历史审计材料。"
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.context-and-public-authority-update
  - key: verification-sequence-and-current-candidate
    source_ref: docs/long-task-real-capability-closure.md
    statement: 机制候选验证顺序是 build/typecheck/format → focused attack/control/owner tests → Delivery/Long-Task focused → Trust Boundary Gate → complete package regression → source/managed/package parity → consumer/tarball smoke → Context validation → current-run 黑盒 Final Gate report。当前 complete Long-Task test population 的审查分类是 18 pure、50 isolated、11 exclusive；新测试必须先分类，不能默认进入并发 lane。当前 Source/Contract 迁移不自举 Compile/Verify/Final/Close；它只接受 Preflight 结构检查并明确保留两个 blocks_target External Confirmation，独立审计与真实 ROI 完成后才可修订能力等级。
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.verification-sequence-and-current-candidate
  - key: final-hard-acceptance
    source_ref: docs/long-task-real-capability-closure.md
    statement: Level 4 的硬验收仍要求：custom Oracle 不能关闭 machine Claim；runner 不能创建/修改 static actual；process runtime 由 Harness 直接持有的 Source-backed root 进程证明；项目 actual/pass/verdict/runtime/interaction/state 不能自证；unsupported family/method 必须 External Confirmation；Counterfactual 必须观察真实 carrier 导致 actual 变化且不得无观察跳过；V1/V2/non-UI/static/process 共用 exact evaluator；21-case R1–R11b 黑盒集的 18 个 wrong candidate 经真实 Final Gate 拒绝、static/process 正确控制通过、external 控制不 machine-accept；能力 verifier 不以字符串证明 runtime；Trust/full/package/Context 全绿、无开放 critical 反例、独立审计通过、真实 workload 正 ROI 且无第二 Authority/Gate/state/registry。当前这组条件尚未由两项外部确认全部建立，因此只声明 Level 3。
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.final-hard-acceptance
  - key: approved-final-capability-wording
    source_ref: docs/long-task-real-capability-closure.md
    statement: 当前获准表述是：Long-Task 已对声明的已知 observer/runner/self-attestation/production-reachability 反例建立 Level 3 保护；在 static pre-existing unchanged JSON 与 Harness direct-process exact JSON stdout 的受限 TCB 内，项目自报 actual/pass/verdict/runtime、custom Oracle、历史 session、代理 target 与纯 evidence carrier不能单独形成 machine completion，unsupported观察保持阻断型 External Confirmation。不得在 `independent-capability-audit` 与 `real-process-workload-roi` 完成前使用“已高水准实现设计目的”或“最终无漂移保证”的 Level 4 宽泛措辞。
    disposition:
      type: claim
      refs:
        - assurance-governance.requirement.approved-final-capability-wording
  - key: critical-scope-escape-risk
    source_ref: docs/long-task-real-capability-closure.md
    statement: 范围逃逸风险是把 direct-process stdout扩张为任意 runtime/UI truth、把项目 instrumentation当package observer，或建设通用 browser/native/layout/pixel/a11y/motion框架。当前 observer只证明direct product root在声明exact JSON output surface上实际发出的值；无法直接绑定该surface时必须External Confirmation。
    disposition:
      type: risk_fact
      refs:
        - critical_user_path:observer-tcb-closure
  - key: critical-self-attestation-risk
    source_ref: docs/long-task-real-capability-closure.md
    statement: 自证风险来自同一项目控制 implementation、verifier、actual、comparison、verdict或利用ambient OS/filesystem/network绕过隔离closure。package admission、direct root、stdout capture、pre/post freeze与Harness exact owner关闭已知路径，但不声称绝对封禁恶意进程逃逸；更强对手模型必须使用独立sandbox并保持External Confirmation。
    disposition:
      type: risk_fact
      refs:
        - weak_observability:observer-tcb-closure
  - key: critical-claim-inflation-risk
    source_ref: docs/long-task-real-capability-closure.md
    statement: 能力膨胀风险是把命令exit 0、源码token、旧Receipt、fixture replay或fresh-agent汇总误当安全定理。当前固定terminal pair machine report只支持Level 3；`independent-capability-audit`与`real-process-workload-roi`均为blocks_target，任何一项未完成都禁止Level 4。
    disposition:
      type: risk_fact
      refs:
        - critical_user_path:assurance-governance
  - key: independent-capability-audit
    source_ref: docs/long-task-real-capability-closure.md
    statement: 必须由独立于本次开发 Agent 的审计者复核当前候选、21-case R1–R11b 黑盒集与三个正确 terminal control、machine report 完整性、Observer/TCB 能力边界、stable exact planned closure、same-envelope implicit-preserved 与 subtraction review，并确认无开放 critical false acceptance 且能力措辞未超过证据。审计结论在形成明确 Source/Contract Revision 前保持 blocks_target；本次开发 Agent、旧 Receipt、prose 或自交付 verifier 不能自行完成该确认。
    disposition:
      type: external_confirmation
      refs:
        - independent-capability-audit
  - key: real-process-workload-roi
    source_ref: docs/long-task-real-capability-closure.md
    statement: 仓库已实现可复算的真实 Long-Task process workload benchmark：同一 8-Fact product、normal/degraded modes、两个 Counterfactual、单 envelope 多 Fact、独立 semantic gold，以及 A=`0f35e08a` legacy cost/error baseline（永不 safety-eligible）、B=`808efa9e` isolated envelope、C=clean final candidate 的平衡 3→5 repeats、raw SHA closure 与 scoring/verifier owner。但 authentic collection 必须等待干净已提交的 final C，authoring token 必须有 invocation-bound host/provider usage event；当前二者尚未受信完成，不能以 surrogate token 或未经核验的 collection 得出正 ROI。该证据完成并经外部复核前保持 blocks_target。
    disposition:
      type: external_confirmation
      refs:
        - real-process-workload-roi
