source_claims:
  - key: real-capability-closure-result
    source_ref: docs/long-task-real-capability-closure.md
    statement: 当前候选只达到 Level 3：已对声明的已知反例建立可执行保护。P0 exact 重算、防虚假能力声明治理、package-admitted static/process exact observer、生产载体冻结、host-derived process runtime、Counterfactual actual-impact 与黑盒攻击/控制报告已形成当前实现边界；但 Level 4 仍由 `independent-capability-audit` 与 `real-process-workload-roi` 两个阻断型 External Confirmation 明确拦截。在二者完成并形成新的 Source/Contract Revision 前，不得宣称 Long-Task 已在明确 TCB 内高水准实现全部设计目的。
    disposition:
