  - key: p0-v2-negative-control
    source_ref: docs/long-task-real-capability-closure.md
    statement: V2 symbolic 必须具有与 V1 同构的独立负向控制：规则/区域对应的 actual digest 与 frozen expected digest 不同而项目自报通过时必须被拒绝；V2 的规则、区域、certificate identity 仍按既有 symbolic owner 校验，不得因为修 exact 而弱化 V2 的 extensional closure。
    disposition:
      type: claim
      refs:
        - p0-exact-recomputation.requirement.p0-v2-negative-control
  - key: shared-exact-comparison-owner
    source_ref: docs/long-task-real-capability-closure.md
    statement: 提取或复用一个共享 exact comparison primitive，输入至少包含 actual digest、expected digest、comparator、mode、parameters、tolerance 和 mask，输出由 Harness 计算的 comparison result 与 result identity。selected-design runtime 必须复用非 UI exact/result-identity 的既有语义或共享底层 primitive，消除两条路径的重复真相；项目提交的 `passed`/`verdict` 只能作为兼容冗余，与 Harness 结果不一致时 fail closed。
    disposition:
      type: claim
      refs:
        - p0-exact-recomputation.requirement.shared-exact-comparison-owner
