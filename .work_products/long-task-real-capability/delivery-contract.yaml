  - key: p0-v1-negative-control
    source_ref: docs/long-task-real-capability-closure.md
    statement: V1 ground 必须具有独立负向控制：`actual != expected` 同时项目提交 `comparison.passed = true`、`verdict = passed` 时，Harness 必须在 selected-design comparison owner 处拒绝，错误 ground truth 不能由被测 verifier 生成，且失败需定位到 exact comparison/result identity 语义而非无关 schema。
    disposition:
      type: claim
      refs:
