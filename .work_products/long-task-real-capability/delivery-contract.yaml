          statement: 项目 owner 继续选择路线 B：普通模型编写 verifier 的错误、自报 actual/verdict/runtime、历史 session、代理 target 和纯 evidence carrier 属于威胁模型。首版实现只准入 package static JSON exact 与 package direct-process JSON exact；其他 observer 诚实进入 External Confirmation，不以保留 custom Oracle 的机器兼容换取表面兼容。
