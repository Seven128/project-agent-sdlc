      requirements:
        - key: purpose-validity-floor-before-relative-antidegradation
          statement: 机制开发准入顺序必须是：在明确威胁模型与 TCB 内的声明目的有效性下限 → 相对非劣化 → 有效候选不被误阻 → 总成本与 ROI。有效性下限至少要求冻结关键反例全部被拒绝、正确控制组全部通过、没有未关闭的已知 critical false acceptance、能力声明不超过证据支持范围；它不是“绝对正确”机器状态，也不得成为消费者 Long-Task 的新 Gate、状态、Authority 或 registry。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - assurance-governance-current-success
        - key: invalid-baseline-and-claim-downgrade
          statement: 发现 current `main` 的 critical false-completion path 后，错误行为被标记为 defect，不属于需要保留的有效 Coverage；相关高水准能力声明立即降级，反例先进入固定威胁集，候选必须证明旧版接受且修复版拒绝。在回归、可信观察闭环和要求的真实回放完成前，不得以旧测试绿色、总体逻辑、文档禁止或项目 verifier 写错为由维持原声明。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - assurance-governance-current-success
        - key: coverage-defined-by-rejected-attack-surface
          statement: 防劣化 Coverage 表示机制能拒绝的已知错误完成路径集合，不以测试文件数、Assertion 数、Fact 数、哨兵名称或 CI 绿色计数代替。相对比较只能使用已证明有效的 baseline：`Coverage_new` 不少于有效 baseline，false-negative resistance、false-positive behavior、Authority、freshness 与 fail-closed 不得变弱；选择一个允许方案不删除其他仍受支持的允许成员。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - assurance-governance-current-success
        - key: critical-sentinel-positive-negative-controls
          statement: 现有 `CRITICAL_TEST_SENTINELS` 复用四个唯一 canonical 边界：`observer-admission-no-bypass` 对应 R1，`static-carrier-pre-run-freeze` 对应 R7b，`host-derived-target-runtime` 对应 R3，`counterfactual-production-observation-impact` 对应 R8。每个 sentinel 必须绑定准确的正/负控制、真实 owner、完整 runtime 路径和明确的不证明内容；不得用 tolerance/mask、native/UI 或字符串存在性扩大 rationale。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - assurance-governance-current-success
        - key: incident-counterexample-first-rule
          statement: 任何真实的明显需求违背、selected-design 漂移、历史证据冒充当前证据、verifier 自证或 Final Gate 近似错误接受，必须先形成能在旧版复现的最小负向 fixture，再修改实现；修复后证明旧版接受、当前版拒绝，且失败落在声明的语义 owner。开放 critical counterexample 自动降级对应能力声明。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - assurance-governance-current-success
        - key: sentinel-rationale-evidence-bounded
          statement: critical sentinel 的 rationale 只能覆盖其 canonical 黑盒反例与正确控制实际证明的 owner 边界；固定 test ID、workflow terminal 和 wrong/control 对照必须来自当前 invocation 的独占 machine report，不能由 aggregate Boolean、命令 exit 0 或源码 token 存在替代。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - assurance-governance-current-success
        - key: capability-claim-levels
          statement: 正式结论保持四级：Level 1 已设计、Level 2 已实现、Level 3 已建立声明内已知反例保护、Level 4 在明确 TCB 内高水准实现设计目的。当前候选最多为 Level 3；只有 `independent-capability-audit` 和 `real-process-workload-roi` 都完成、无开放 critical counterexample 且 Source/Contract 显式修订后才可进入 Level 4。GPT/Codex/人工 prose、文档、绿测数量、旧 Receipt 或 fresh-agent 汇总都不能自行提升等级。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - assurance-governance-current-success
        - key: approved-final-capability-wording
          statement: 当前获准表述是：Long-Task 已对声明的已知 observer/runner/self-attestation/production-reachability 反例建立 Level 3 保护；在 static pre-existing unchanged JSON 与 Harness direct-process exact JSON stdout 的受限 TCB 内，项目自报 actual/pass/verdict/runtime、custom Oracle、历史 session、代理 target 与纯 evidence carrier不能单独形成 machine completion，unsupported观察保持阻断型 External Confirmation。不得在 `independent-capability-audit` 与 `real-process-workload-roi` 完成前使用“已高水准实现设计目的”或“最终无漂移保证”的 Level 4 宽泛措辞。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - assurance-governance-current-success
