source_claims:
  - key: real-capability-closure-result
    source_ref: docs/long-task-real-capability-closure.md
    statement: Long-Task 的真实能力与防劣化闭环必须完成四个不可拆散的结果：立即关闭 selected-design `exact_value + exact` 的已知假阳性；同步让关键哨兵和能力声明治理能够证明其宣称防御的错误候选确实被拒绝；明确选择并落实把普通模型编写 verifier 的错误纳入威胁模型的 Observer/TCB 路线 B；最后用确定性攻击/控制组、当前候选 Trust/full/package 验证、受控脱敏真实项目回放和只用于遵循率/ROI 的 fresh-agent 证据完成准入。P0 完成只证明关闭一个确定漏洞，在可信观察闭环和真实回放完成前不得恢复“Long-Task 已高水准抵御模型自然漂移并保证最终无漂移交付”的宽泛声明。
    disposition:
      type: outcome_result
      ref: proof-and-roi.result
  - key: material-input-provenance
    source_ref: docs/long-task-real-capability-closure.md
    statement: 本 Source 是本 Goal 唯一的项目原生需求载体，完整归并三类输入：原方案附件 `pasted-text.txt`，其 SHA-256 为 `d9ffda69a25d2145f881114e3fc1969173f1560fb748a6ebb2874f73155888c8`；Codex 对该方案的仓库证据审计与修正；用户粘贴的 GPT Pro 最终裁决。附件中未被最终裁决推翻的要求继续有效；Codex 审计对绝对有效性、observer 文件年龄、challenge、通用 artifact 解析、重复设计 Fact 体系、generated carrier、Counterfactual、benchmark、v4 和能力措辞的修正优先；GPT Pro 明确批准的路线 B 和工作包 0–4 是最终用户 Authority。任何压缩或恢复都必须从本 Source、Contract、Active Authority 和 owning Context 重建，而不是依赖对话记忆。
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.material-input-provenance
  - key: declared-assurance-theorem
    source_ref: docs/long-task-real-capability-closure.md
    statement: 正式能力定理必须限制在完整、准确的声明范围、预期细粒度、机器索引的 Fact×条件×方法宇宙和已准入观察/TCB 内：任何仍存在于该宇宙且能由准入观察链发现的当前生产漂移，不得进入 `machine_accepted`；无法建立可信机器观察的 Fact 保持未完成或进入 External Confirmation。该定理不得扩张为自动发现未表达意图、证明任意 Oracle 语义正确，或抵御 TCB 外的一切模型与宿主行为。
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.declared-assurance-theorem
  - key: assurance-causal-chain
    source_ref: docs/long-task-real-capability-closure.md
    statement: 完成链必须保持单向：完整准确 Source Authority → 无遗漏保义的细粒度 Fact 投影 → Fact×适用条件×所需方法闭包 → 从当前生产目标采集 actual → Harness 或其直接调用的冻结 comparator 重算比较 → 每个 Fact 可独立归因且通过因果敏感性验证 → 同一当前快照的唯一 Final Gate → `machine_accepted`。代码、项目 verifier、自报结果、历史 Receipt 或 prose 不得反向成为 expected Authority。
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.assurance-causal-chain
  - key: known-selected-design-false-acceptance
    source_ref: docs/long-task-real-capability-closure.md
    statement: '当前已知 critical false-acceptance 位于 selected-design evidence runtime：正向 fixture 的 expected digest 为 `"a".repeat(64)`、actual digest 为 `"f".repeat(64)`，但 comparison `passed: true` 和 verdict `passed` 仍被接受；ground 与 symbolic 路径只校验 identity、authority、artifact 与提交字段的一致性，没有执行 `actual == expected` 或重算 comparison result identity。非 UI `semantic_fact` 路径已经执行 exact 摘要比较并重算 identity，因此缺陷必须 owner-local 修复，不能笼统重写整个 Evidence Kernel。'
    disposition:
