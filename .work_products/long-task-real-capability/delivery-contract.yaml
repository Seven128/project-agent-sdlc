    product:
      observable_result: Long-Task 的真实能力与防劣化闭环必须完成四个不可拆散的结果：立即关闭 selected-design `exact_value + exact` 的已知假阳性；同步让关键哨兵和能力声明治理能够证明其宣称防御的错误候选确实被拒绝；明确选择并落实把普通模型编写 verifier 的错误纳入威胁模型的 Observer/TCB 路线 B；最后用确定性攻击/控制组、当前候选 Trust/full/package 验证、受控脱敏真实项目回放和只用于遵循率/ROI 的 fresh-agent 证据完成准入。P0 完成只证明关闭一个确定漏洞，在可信观察闭环和真实回放完成前不得恢复“Long-Task 已高水准抵御模型自然漂移并保证最终无漂移交付”的宽泛声明。
      result_applicability_refs:
        - proof-and-roi-current-success
      success_path_required: true
      degradation_path_required: false
      owner:
        label: harness-package
        context_refs:
          - project_context/areas/harness-package.md
          - project_context/areas/harness-package/decision-rationale/long-task-workflow.md
          - project_context/areas/harness-package/implementation-index.md
        path_globs:
          - README.md
          - README.zh-CN.md
          - packages/ty-context/README.md
          - packages/ty-context/assets/README.md
          - packages/ty-context/assets/README.zh-CN.md
          - packages/ty-context/source-mappings.yaml
          - packages/ty-context/src/lib/long-task-admitted-observation.ts
          - tests/ty-context/fixtures/long-task-real-capability-state.json
          - docs/long-task-real-capability-closure.md
          - PROJECT_SPEC.md
          - project_context/**
          - .codex/skills/authoring/harness_package_design/**
      requirements:
        - key: material-input-provenance
          statement: 本 Source 是本 Goal 唯一的项目原生需求载体，完整归并三类输入：原方案附件 `pasted-text.txt`，其 SHA-256 为 `d9ffda69a25d2145f881114e3fc1969173f1560fb748a6ebb2874f73155888c8`；Codex 对该方案的仓库证据审计与修正；用户粘贴的 GPT Pro 最终裁决。附件中未被最终裁决推翻的要求继续有效；Codex 审计对绝对有效性、observer 文件年龄、challenge、通用 artifact 解析、重复设计 Fact 体系、generated carrier、Counterfactual、benchmark、v4 和能力措辞的修正优先；GPT Pro 明确批准的路线 B 和工作包 0–4 是最终用户 Authority。任何压缩或恢复都必须从本 Source、Contract、Active Authority 和 owning Context 重建，而不是依赖对话记忆。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - proof-and-roi-current-success
        - key: declared-assurance-theorem
          statement: 正式能力定理必须限制在完整、准确的声明范围、预期细粒度、机器索引的 Fact×条件×方法宇宙和已准入观察/TCB 内：任何仍存在于该宇宙且能由准入观察链发现的当前生产漂移，不得进入 `machine_accepted`；无法建立可信机器观察的 Fact 保持未完成或进入 External Confirmation。该定理不得扩张为自动发现未表达意图、证明任意 Oracle 语义正确，或抵御 TCB 外的一切模型与宿主行为。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - proof-and-roi-current-success
        - key: assurance-causal-chain
          statement: 完成链必须保持单向：完整准确 Source Authority → 无遗漏保义的细粒度 Fact 投影 → Fact×适用条件×所需方法闭包 → 从当前生产目标采集 actual → Harness 或其直接调用的冻结 comparator 重算比较 → 每个 Fact 可独立归因且通过因果敏感性验证 → 同一当前快照的唯一 Final Gate → `machine_accepted`。代码、项目 verifier、自报结果、历史 Receipt 或 prose 不得反向成为 expected Authority。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - proof-and-roi-current-success
        - key: attack-suite-ground-truth
          statement: 确定性 attack suite 的 hidden ground truth 由测试 harness/package owner 持有，不由项目 verifier 生成。必须覆盖：A1 actual≠expected 但自报 pass；A2 expected 复制为 actual；A3 Anatomy 错而局部控件正确；A4 整体视觉模式错误；A5 主要行动层级错误；A6 大量异质 Assertion 共读 aggregate status；A7 mutation 指向纯 evidence carrier；A8 历史 native session；A9 H5/browser 代理冒充 native target；A10 旧截图与当前 tree 不一致；A11 task-authored verifier 是唯一 material Oracle；A12 asset_integrity 错误关闭 layout/a11y/motion。每个失败必须定位到对应 owner，而非无关 fixture/schema。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - proof-and-roi-current-success
        - key: valid-control-suite
          statement: 正确控制组必须证明：合法 tolerance 与动态 mask；一次 render/artifact 被多个 Fact 使用但 locator/result 独立；中心 token 合法影响多个细粒度 Fact；正确 scoped reference+constraint；准入的当前 native session；能力完整且冻结的 observer；正确 exact 候选；非 UI Long-Task 现有行为；普通 Workflow Contract 零新增运行成本；以及无可信机器观察时 External Confirmation 不被误当失败或 machine acceptance。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - proof-and-roi-current-success
        - key: starward-sanitized-replay
          statement: 恢复“在明确 TCB 内已高水准实现设计目的”前必须完成一个受控脱敏的 Starward 派生真实项目回放，至少包含地图页、点位详情、点位夜空、“我的”页、selected design、错误与正确生产实现、自证 verifier、历史 native session 和 H5 代理路径；hidden ground truth 由 harness 持有。Starward 回放不是 P0 的前置条件，但属于本 Goal 最终能力声明恢复的前置条件。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - proof-and-roi-current-success
        - key: fresh-agent-benchmark-boundary
          statement: fresh-agent 配对实验复用现有冻结任务、隐藏 probe、独立配对和 2/3→必要时 3/5 的治理，只衡量 Agent 遵循率、首次发现时间、返工、Contract/Compile/Final Gate 成本、target 采集次数、token、总时长、Authority 体积、迁移与维护成本。它不得证明安全定理、关键假阳性为零或替代 deterministic attack suite、黑盒 Final Gate 与真实回放；若增设 track，应沿用现有 benchmark owner 而非第二框架。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - proof-and-roi-current-success
        - key: roi-admission-order
          statement: 机制 ROI 按字典序准入：先满足目的有效性下限和 known attack rejection；再保证 valid control false blocking 不增加；再证明相对 coverage/fail-closed/Authority 不劣化；最后比较总时间、token、存储、维护、迁移和用户等待成本。性能或成本结论必须声明 workload、baseline/budget、环境、comparator/tolerance 和项目自有测量；不得用静态 shape 或一次 anecdotal run 代替。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - proof-and-roi-current-success
        - key: early-real-entry-feedback
          statement: material UI + selected design 在第一个有用的真实生产入口可运行且早期定位收益高于运行成本时，建议用最终同类 observer 做一次页面 Anatomy、信息/行动层级、整体视觉模式和区域关系的早期并排检查；它不新增 Gate、状态、Receipt 或完成前提，早期 artifact 仅供诊断，最终候选必须重新采集并跑完整 cold-start journey。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - proof-and-roi-current-success
        - key: context-and-public-authority-update
          statement: "总体 `Context Delta: required`。必须在代码前更新 `PROJECT_SPEC.md` 和 owning Context，记录路线 B 的项目 owner 决策、旧/新定理边界、observer capability/TCB、目的有效性下限、critical counterexample/claim downgrade、owner/dependency/debt/compatibility/验证；实现索引与验证 Context 必须指向真实代码与检查。若改变公共用户行为或协议，还要同步 managed source、Skills、英文/中文公共文档、package/readme/examples 和 distribution parity；P0 单独行为修复不需要虚构新的 durable owner。"
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - proof-and-roi-current-success
