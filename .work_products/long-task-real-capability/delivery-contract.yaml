      requirements:
        - key: observation-channel-authority
          statement: 能关闭 machine Claim 的观察通道必须按能力和完整观察链准入，而非按文件年龄：package-owned/admitted observer；Harness 直接调用且依赖闭包冻结的 executable comparator/adapter；经明确冻结 TCB、当前 snapshot、生产可达性和因果控制证明的项目 observer。项目 verifier 不能仅凭自报 actual digest、comparison、passed 或 verdict 关闭 material/selected-design Claim；无法满足准入能力时必须 fail closed 或使用现有 External Confirmation。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - observer-tcb-closure-current-success
        - key: bounded-admitted-artifact-contract
          statement: 首版 artifact contract 冻结为 package-owned `json-pointer-exact-v1`：只接受仓库/Check 准入根内、当前执行收集的 UTF-8 JSON，locator 只允许 RFC 6901 JSON Pointer（对象键和 canonical 非负数组下标；禁止 URI fragment、wildcard、filter 和 custom locator），值按现有 canonical JSON 语义规范化（对象键排序、数组顺序保留、JSON scalar/null 精确保留）后摘要；只支持 `exact_value + exact` 且 tolerance/mask 必须为空。单文件上限 1 MiB、嵌套深度 64、pointer 4096 字节/128 段、单个规范化值 256 KiB、每 Check 最多 256 个 observation artifact 且总计 16 MiB；路径必须 containment/no-follow 并拒绝 symlink/path escape，JSON 重复对象键和非 JSON 数值 fail closed。plain 值可在内存规范化但不新增 raw evidence；protected 值首版不从普通 JSON artifact machine-accept，只允许直接调用的冻结 adapter 或 External Confirmation。extractor/comparator 的 package identity/version/spec digest 必须冻结。首版不扩展成布局树、可访问性树、时间线、像素或任意 custom locator 的通用 UI 观察框架。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - observer-tcb-closure-current-success
        - key: actual-artifact-reextraction
          statement: 对于 `json-pointer-exact-v1`，Harness 必须从当前 artifact 与 locator 重新提取、规范化 actual 并计算 digest，不能只相信 runner 提交的 `value_sha256`；提交值、Harness 重算值和冻结 expected 任一不一致都 fail closed。该路径只准入 package-owned extractor，或由 Harness 直接调用且 digest/version/capability 冻结的 adapter；v3 没有可安全表达直接调用入口的任意项目 executable，因此普通 `named_external_tcb`/项目 runner 的自报 JSON 不能单独 machine-accept。无法由 package 解析的 custom locator、protected raw 值、live native/session、layout/a11y/motion/pixel/tolerance/mask 首版保持 External Confirmation。P0 的 digest equality 是第一步，不能被误称为任意 artifact authenticity。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - observer-tcb-closure-current-success
        - key: challenge-is-freshness-only
          statement: Final Gate challenge/nonce 只用于拒绝直接复用旧截图、旧 session JSON 和旧 evidence payload；若未来准入 live-session，它必须绑定当前 invocation、candidate Git commit/tree、workspace snapshot、runner/build identity、target process/session、启动/采集时间和操作轨迹。首版 `json-pointer-exact-v1` 只接受 Final Gate 当前执行重新收集并绑定当前 snapshot/hash 的静态 JSON，不以新增 challenge 字段伪装 live-session 可信度；native/live 继续 External Confirmation。challenge 不是信任根，因为项目 runner 可以读取并回显新 challenge；主动伪造还必须由准入 observer、expected/actual 隔离、Harness comparator、生产可达性和 Counterfactual 共同防御。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - observer-tcb-closure-current-success
        - key: generated-carrier-semantic-role
          statement: carrier 准入按语义角色而非路径年龄或一刀切路径名单判断：纯 evidence/report/status/comparison/Receipt/历史 session 产物不得充当生产 carrier；由构建生成且被真实产品 target 消费的 bundle、配置或编译产物可以作为生产 carrier；只被 verifier 读取的生成物不能证明生产可达性。不得笼统禁止所有 `expected_output_paths`，而要证明其是否进入产品 target 的真实依赖或运行时读取链。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - observer-tcb-closure-current-success
        - key: expected-to-actual-self-proof-rejection
          statement: 必须阻止 expected→actual 自证：actual artifact/locator 不得指向 Contract、handoff、expected resource 或 comparison artifact；actual 必须来自当前 target/session 或其真实消费的构建产物；同任务 verifier 不能独立关闭关键 Claim；生产语义 mutation 后 actual 必须按声明影响集发生变化。静态扫描 verifier 是否读取 expected 只能作为诊断，不能成为唯一安全边界。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - observer-tcb-closure-current-success
        - key: production-reachability
          statement: 敏感 Counterfactual 的 Binding 必须能证明至少一种生产可达性：位于 target root 的冻结静态依赖闭包；进入生产 bundle/build manifest；属于 target 运行时直接读取路径；或 mutation 被准入 observer 证明改变了当前目标 actual。只被 verifier 或报告生成器消费的路径不得用于关闭生产语义 Claim。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - observer-tcb-closure-current-success
        - key: counterfactual-actual-change-and-impact-set
          statement: Counterfactual 不只检查 Assertion 从 true 变 false，还必须比较 baseline 与 mutated actual，保持 target liveness，并对声明的受影响 Fact 集逐项产生可归因失败。一个中心 token/carrier 可以合法影响多个相关 Fact，但每个 Fact 仍需独立 locator/result；影响集必须精确声明，允许真实 fan-out，禁止把“所有无关 Fact 都不变”写成不可能约束，也禁止一个 aggregate `/status` 关闭无直接因果关系的异质 Claim。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - observer-tcb-closure-current-success
        - key: v3-v4-and-migration-rule
          statement: P0 与首版 `json-pointer-exact-v1` 使用 v3 已有 artifact path/hash、JSON Pointer、Oracle/environment 和 comparison 字段，由 compiled/current-evidence 内部元数据补充 package adapter identity 与资源上限，因此不发布 v4；任意外部 executable 直接调用描述、可信 live-session handle/challenge/trace 或新 observation authority 若无法用 v3 保义表达，才发布 v4。若需要 v4，必须同步 schema、types/codec/decoder、managed source、Context、英文/中文 README、package README、examples、tests、source sync、tarball/consumer 验证和迁移说明；旧 Active Authority 不得自动迁移为通过，verifier/Authority identity 变化必须重新 Compile，旧 v3 selected-design 自报结果不能自动升级为通过。
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - observer-tcb-closure-current-success
      owner_surfaces: []
      controls: []
      control_relation_closure:
        state: not_applicable
        statement: This non-UI mechanism Outcome declares no user Controls or cross-Control relation.
        applicability_refs:
