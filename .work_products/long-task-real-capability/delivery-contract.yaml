      refs:
        - critical_user_path:p0-exact-recomputation
  - key: p0-positive-fixture-correction
    source_ref: docs/long-task-real-capability-closure.md
    statement: 默认 selected-design 正向 fixture 必须使 `actual_observation.value_sha256 == expected.sha256`；任何 mismatch 必须由测试显式构造并断言失败，禁止正向 fixture 继续内含实际不一致却自报通过的 Fact。
    disposition:
