    disposition:
      type: claim
      refs:
        - p0-exact-recomputation.requirement.p0-owner-local-and-v3-compatible
  - key: p0-verification-boundary
    source_ref: docs/long-task-real-capability-closure.md
    statement: P0 当前候选必须依次通过 focused exact mismatch tests、`selected-design-fact-closure`/新强化的 `selected-design-exact-verdict-recomputation` critical sentinel、Long-Task Trust Boundary Gate、affected tests 和完整 package regression；还需证明旧行为接受冻结反例而修复候选拒绝它。P0 通过不得被表述为完整设计目的已恢复。
    disposition:
      type: acceptance
      refs:
        - p0-exact-recomputation.verify-p0-exact-recomputation.acceptance-p0-verification-boundary
  - key: purpose-validity-floor-before-relative-antidegradation
    source_ref: docs/long-task-real-capability-closure.md
    statement: 机制开发准入顺序必须是：在明确威胁模型与 TCB 内的声明目的有效性下限 → 相对非劣化 → 有效候选不被误阻 → 总成本与 ROI。有效性下限至少要求冻结关键反例全部被拒绝、正确控制组全部通过、没有未关闭的已知 critical false acceptance、能力声明不超过证据支持范围；它不是“绝对正确”机器状态，也不得成为消费者 Long-Task 的新 Gate、状态、Authority 或 registry。
    disposition:
      type: claim
      refs:
        - assurance-governance.requirement.purpose-validity-floor-before-relative-antidegradation
  - key: invalid-baseline-and-claim-downgrade
    source_ref: docs/long-task-real-capability-closure.md
    statement: 发现 current `main` 的 critical false-completion path 后，错误行为被标记为 defect，不属于需要保留的有效 Coverage；相关高水准能力声明立即降级，反例先进入固定威胁集，候选必须证明旧版接受且修复版拒绝。在回归、可信观察闭环和要求的真实回放完成前，不得以旧测试绿色、总体逻辑、文档禁止或项目 verifier 写错为由维持原声明。
    disposition:
      type: claim
      refs:
        - assurance-governance.requirement.invalid-baseline-and-claim-downgrade
  - key: coverage-defined-by-rejected-attack-surface
    source_ref: docs/long-task-real-capability-closure.md
    statement: 防劣化 Coverage 表示机制能拒绝的已知错误完成路径集合，不以测试文件数、Assertion 数、Fact 数、哨兵名称或 CI 绿色计数代替。相对比较只能使用已证明有效的 baseline：`Coverage_new` 不少于有效 baseline，false-negative resistance、false-positive behavior、Authority、freshness 与 fail-closed 不得变弱；选择一个允许方案不删除其他仍受支持的允许成员。
    disposition:
      type: claim
      refs:
        - assurance-governance.requirement.coverage-defined-by-rejected-attack-surface
  - key: critical-sentinel-positive-negative-controls
    source_ref: docs/long-task-real-capability-closure.md
    statement: 每个高层 critical sentinel 至少绑定：一个正确候选通过；一个直接违反该能力的错误候选失败；独立于被测 verifier 的 ground truth；修改真实生产语义的 mutation；在声明 owner/Fact/Assertion 边界的预期定位；以及证明合法共享执行、容差、mask 和动态值不会被误阻的控制组。继续复用 `CRITICAL_TEST_SENTINELS`，不新增第二 registry。
    disposition:
      type: claim
      refs:
        - assurance-governance.requirement.critical-sentinel-positive-negative-controls
  - key: incident-counterexample-first-rule
    source_ref: docs/long-task-real-capability-closure.md
    statement: 任何真实的明显需求违背、selected-design 漂移、历史证据冒充当前证据、verifier 自证或 Final Gate 近似错误接受，必须先形成能在旧版复现的最小负向 fixture，再修改实现；修复后证明旧版接受、当前版拒绝，且失败落在声明的语义 owner。开放 critical counterexample 自动降级对应能力声明。
    disposition:
      type: claim
      refs:
        - assurance-governance.requirement.incident-counterexample-first-rule
  - key: sentinel-rationale-evidence-bounded
    source_ref: docs/long-task-real-capability-closure.md
    statement: 现有 critical sentinel rationale 和测试策略描述不得超过实际正负控制证明的范围。`selected-design-exact-verdict-recomputation` 应强化现有 semantic-drift-closure 测试和现有 registry 项，不必新建测试文件；如果测试只证明 exact digest 重算，就不得声称已证明任意 observer、任意 UI 格式或完整 live-session 真实性。
    disposition:
      type: claim
      refs:
        - assurance-governance.requirement.sentinel-rationale-evidence-bounded
  - key: capability-claim-levels
    source_ref: docs/long-task-real-capability-closure.md
    statement: 正式开发与发布结论只使用四级能力表述：已设计；已实现；已建立已知反例保护；在明确 TCB 内已高水准实现设计目的。最高级必须同时具备明确支持范围/TCB、Source 与投影闭包、独立当前 actual、Harness 重算 verdict、关键攻击全拒绝、正确控制组通过、黑盒 Final Gate、至少一个真实或脱敏真实项目回放、无开放 critical counterexample 和机制 ROI 准入。GPT、Codex、人工 prose 审计、文档声明、测试数量或单次 benchmark 都不能提升等级。
    disposition:
      type: claim
      refs:
        - assurance-governance.requirement.capability-claim-levels
  - key: route-b-project-owner-decision
    source_ref: docs/long-task-real-capability-closure.md
    statement: 项目 owner 本次明确选择 Observer/TCB 路线 B：普通模型编写 verifier 的错误属于威胁模型。路线 A——继续完全信任正确冻结 verifier/runner TCB 并将能力声明收窄为“阻止该 TCB 已正确观察的漂移”——保留为被拒绝的本次选择和兼容理解，不得作为无限期延期路线 B 的理由。路线 B 是恢复宽泛设计目的声明的必要闭环，必须在本 Goal 内设计、实现和验证。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.obligation.route-b-project-owner-decision
  - key: observation-channel-authority
    source_ref: docs/long-task-real-capability-closure.md
    statement: 能关闭 machine Claim 的观察通道必须按能力和完整观察链准入，而非按文件年龄：package-owned/admitted observer；Harness 直接调用且依赖闭包冻结的 executable comparator/adapter；经明确冻结 TCB、当前 snapshot、生产可达性和因果控制证明的项目 observer。项目 verifier 不能仅凭自报 actual digest、comparison、passed 或 verdict 关闭 material/selected-design Claim；无法满足准入能力时必须 fail closed 或使用现有 External Confirmation。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.requirement.observation-channel-authority
  - key: expected-actual-comparison-verdict-ownership
    source_ref: docs/long-task-real-capability-closure.md
    statement: expected 的值/定位摘要与比较 Authority 由 Source、canonical design resource 和 Contract 冻结；actual 由当前生产 target/session 的准入 observer 从声明 artifact/locator 提取；comparison 与 result identity 由 Harness-owned primitive 或 Harness 直接调用的冻结 comparator 计算；最终 verdict 由 Evidence Kernel/Final Gate 从重算结果得出。项目 runner 可提交原始观察、环境、artifact、locator 和兼容冗余字段，但不得同时拥有 expected、actual、comparison 和 authoritative verdict。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.obligation.expected-actual-comparison-verdict-ownership
  - key: bounded-admitted-artifact-contract
    source_ref: docs/long-task-real-capability-closure.md
    statement: 首版 artifact contract 冻结为 package-owned `json-pointer-exact-v1`：只接受仓库/Check 准入根内、当前执行收集的 UTF-8 JSON，locator 只允许 RFC 6901 JSON Pointer（对象键和 canonical 非负数组下标；禁止 URI fragment、wildcard、filter 和 custom locator），值按现有 canonical JSON 语义规范化（对象键排序、数组顺序保留、JSON scalar/null 精确保留）后摘要；只支持 `exact_value + exact` 且 tolerance/mask 必须为空。单文件上限 1 MiB、嵌套深度 64、pointer 4096 字节/128 段、单个规范化值 256 KiB、每 Check 最多 256 个 observation artifact 且总计 16 MiB；路径必须 containment/no-follow 并拒绝 symlink/path escape，JSON 重复对象键和非 JSON 数值 fail closed。plain 值可在内存规范化但不新增 raw evidence；protected 值首版不从普通 JSON artifact machine-accept，只允许直接调用的冻结 adapter 或 External Confirmation。extractor/comparator 的 package identity/version/spec digest 必须冻结。首版不扩展成布局树、可访问性树、时间线、像素或任意 custom locator 的通用 UI 观察框架。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.requirement.bounded-admitted-artifact-contract
  - key: actual-artifact-reextraction
    source_ref: docs/long-task-real-capability-closure.md
    statement: 对于 `json-pointer-exact-v1`，Harness 必须从当前 artifact 与 locator 重新提取、规范化 actual 并计算 digest，不能只相信 runner 提交的 `value_sha256`；提交值、Harness 重算值和冻结 expected 任一不一致都 fail closed。该路径只准入 package-owned extractor，或由 Harness 直接调用且 digest/version/capability 冻结的 adapter；v3 没有可安全表达直接调用入口的任意项目 executable，因此普通 `named_external_tcb`/项目 runner 的自报 JSON 不能单独 machine-accept。无法由 package 解析的 custom locator、protected raw 值、live native/session、layout/a11y/motion/pixel/tolerance/mask 首版保持 External Confirmation。P0 的 digest equality 是第一步，不能被误称为任意 artifact authenticity。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.requirement.actual-artifact-reextraction
  - key: challenge-is-freshness-only
    source_ref: docs/long-task-real-capability-closure.md
    statement: Final Gate challenge/nonce 只用于拒绝直接复用旧截图、旧 session JSON 和旧 evidence payload；若未来准入 live-session，它必须绑定当前 invocation、candidate Git commit/tree、workspace snapshot、runner/build identity、target process/session、启动/采集时间和操作轨迹。首版 `json-pointer-exact-v1` 只接受 Final Gate 当前执行重新收集并绑定当前 snapshot/hash 的静态 JSON，不以新增 challenge 字段伪装 live-session 可信度；native/live 继续 External Confirmation。challenge 不是信任根，因为项目 runner 可以读取并回显新 challenge；主动伪造还必须由准入 observer、expected/actual 隔离、Harness comparator、生产可达性和 Counterfactual 共同防御。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.requirement.challenge-is-freshness-only
  - key: generated-carrier-semantic-role
    source_ref: docs/long-task-real-capability-closure.md
    statement: carrier 准入按语义角色而非路径年龄或一刀切路径名单判断：纯 evidence/report/status/comparison/Receipt/历史 session 产物不得充当生产 carrier；由构建生成且被真实产品 target 消费的 bundle、配置或编译产物可以作为生产 carrier；只被 verifier 读取的生成物不能证明生产可达性。不得笼统禁止所有 `expected_output_paths`，而要证明其是否进入产品 target 的真实依赖或运行时读取链。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.requirement.generated-carrier-semantic-role
  - key: expected-to-actual-self-proof-rejection
    source_ref: docs/long-task-real-capability-closure.md
    statement: 必须阻止 expected→actual 自证：actual artifact/locator 不得指向 Contract、handoff、expected resource 或 comparison artifact；actual 必须来自当前 target/session 或其真实消费的构建产物；同任务 verifier 不能独立关闭关键 Claim；生产语义 mutation 后 actual 必须按声明影响集发生变化。静态扫描 verifier 是否读取 expected 只能作为诊断，不能成为唯一安全边界。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.requirement.expected-to-actual-self-proof-rejection
  - key: production-reachability
    source_ref: docs/long-task-real-capability-closure.md
    statement: 敏感 Counterfactual 的 Binding 必须能证明至少一种生产可达性：位于 target root 的冻结静态依赖闭包；进入生产 bundle/build manifest；属于 target 运行时直接读取路径；或 mutation 被准入 observer 证明改变了当前目标 actual。只被 verifier 或报告生成器消费的路径不得用于关闭生产语义 Claim。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.requirement.production-reachability
  - key: counterfactual-actual-change-and-impact-set
    source_ref: docs/long-task-real-capability-closure.md
    statement: Counterfactual 不只检查 Assertion 从 true 变 false，还必须比较 baseline 与 mutated actual，保持 target liveness，并对声明的受影响 Fact 集逐项产生可归因失败。一个中心 token/carrier 可以合法影响多个相关 Fact，但每个 Fact 仍需独立 locator/result；影响集必须精确声明，允许真实 fan-out，禁止把“所有无关 Fact 都不变”写成不可能约束，也禁止一个 aggregate `/status` 关闭无直接因果关系的异质 Claim。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.requirement.counterfactual-actual-change-and-impact-set
  - key: selected-design-existing-owner-preservation
    source_ref: docs/long-task-real-capability-closure.md
    statement: 本 Goal 不重建设计 Fact 类型体系。继续复用现有 Expected/Canonical/Handoff 集合闭包、Fact×method、property→required methods、exact-target layout/pixel、Anatomy、relation、条件空间、V1/V2 identity 和 Final Gate fact_results owners；攻击用例应定位“现有规则未执行”或“证据被错误信任”的位置。资源 preflight 只证明输入完整性，不能代替 production conformance；reference/constraint 的 production 投影和 Fact-method compatibility 继续由既有 owners 承担。
    disposition:
      type: claim
      refs:
        - p0-exact-recomputation.requirement.selected-design-existing-owner-preservation
  - key: no-universal-ui-observer
    source_ref: docs/long-task-real-capability-closure.md
    statement: 首版明确不建设任意 HTML/native/UI 的通用理解、布局、像素、无障碍、时间线或 custom locator 框架，不承诺证明任意 Oracle 语义真实性，也不通过多加字段制造伪 TCB。支持范围外的 target/Fact 必须诚实转为 External Confirmation，后续格式只能经独立机制准入与收益证据扩展。
    disposition:
      type: global_constraint
      refs:
        - non_goal.no-universal-ui-observer
  - key: v3-v4-and-migration-rule
    source_ref: docs/long-task-real-capability-closure.md
    statement: P0 与首版 `json-pointer-exact-v1` 使用 v3 已有 artifact path/hash、JSON Pointer、Oracle/environment 和 comparison 字段，由 compiled/current-evidence 内部元数据补充 package adapter identity 与资源上限，因此不发布 v4；任意外部 executable 直接调用描述、可信 live-session handle/challenge/trace 或新 observation authority 若无法用 v3 保义表达，才发布 v4。若需要 v4，必须同步 schema、types/codec/decoder、managed source、Context、英文/中文 README、package README、examples、tests、source sync、tarball/consumer 验证和迁移说明；旧 Active Authority 不得自动迁移为通过，verifier/Authority identity 变化必须重新 Compile，旧 v3 selected-design 自报结果不能自动升级为通过。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.requirement.v3-v4-and-migration-rule
  - key: attack-suite-ground-truth
    source_ref: docs/long-task-real-capability-closure.md
    statement: 确定性 attack suite 的 hidden ground truth 由测试 harness/package owner 持有，不由项目 verifier 生成。必须覆盖：A1 actual≠expected 但自报 pass；A2 expected 复制为 actual；A3 Anatomy 错而局部控件正确；A4 整体视觉模式错误；A5 主要行动层级错误；A6 大量异质 Assertion 共读 aggregate status；A7 mutation 指向纯 evidence carrier；A8 历史 native session；A9 H5/browser 代理冒充 native target；A10 旧截图与当前 tree 不一致；A11 task-authored verifier 是唯一 material Oracle；A12 asset_integrity 错误关闭 layout/a11y/motion。每个失败必须定位到对应 owner，而非无关 fixture/schema。
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.attack-suite-ground-truth
  - key: valid-control-suite
    source_ref: docs/long-task-real-capability-closure.md
    statement: 正确控制组必须证明：合法 tolerance 与动态 mask；一次 render/artifact 被多个 Fact 使用但 locator/result 独立；中心 token 合法影响多个细粒度 Fact；正确 scoped reference+constraint；准入的当前 native session；能力完整且冻结的 observer；正确 exact 候选；非 UI Long-Task 现有行为；普通 Workflow Contract 零新增运行成本；以及无可信机器观察时 External Confirmation 不被误当失败或 machine acceptance。
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.valid-control-suite
  - key: black-box-final-gate-lifecycle
    source_ref: docs/long-task-real-capability-closure.md
    statement: 黑盒验证必须走真实 Long-Task 生命周期并在同一当前候选上完成 Preflight/Compile、candidate、Final Gate，证明错误候选不能获得 `machine_accepted`、正确候选可以通过、开放外部确认保持 pending、protected inputs/candidate/snapshot 变化会失效，并且失败原因落到具体 Fact/method/observer/production-carrier 边界。历史 Progress、Receipt、targeted pass 或 prose inspection 不是该证据。
    disposition:
      type: acceptance
      refs:
        - proof-and-roi.verify-proof-and-roi.acceptance-black-box-final-gate-lifecycle
  - key: starward-sanitized-replay
    source_ref: docs/long-task-real-capability-closure.md
    statement: 恢复“在明确 TCB 内已高水准实现设计目的”前必须完成一个受控脱敏的 Starward 派生真实项目回放，至少包含地图页、点位详情、点位夜空、“我的”页、selected design、错误与正确生产实现、自证 verifier、历史 native session 和 H5 代理路径；hidden ground truth 由 harness 持有。Starward 回放不是 P0 的前置条件，但属于本 Goal 最终能力声明恢复的前置条件。
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.starward-sanitized-replay
  - key: fresh-agent-benchmark-boundary
    source_ref: docs/long-task-real-capability-closure.md
    statement: fresh-agent 配对实验复用现有冻结任务、隐藏 probe、独立配对和 2/3→必要时 3/5 的治理，只衡量 Agent 遵循率、首次发现时间、返工、Contract/Compile/Final Gate 成本、target 采集次数、token、总时长、Authority 体积、迁移与维护成本。它不得证明安全定理、关键假阳性为零或替代 deterministic attack suite、黑盒 Final Gate 与真实回放；若增设 track，应沿用现有 benchmark owner 而非第二框架。
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.fresh-agent-benchmark-boundary
  - key: roi-admission-order
    source_ref: docs/long-task-real-capability-closure.md
    statement: 机制 ROI 按字典序准入：先满足目的有效性下限和 known attack rejection；再保证 valid control false blocking 不增加；再证明相对 coverage/fail-closed/Authority 不劣化；最后比较总时间、token、存储、维护、迁移和用户等待成本。性能或成本结论必须声明 workload、baseline/budget、环境、comparator/tolerance 和项目自有测量；不得用静态 shape 或一次 anecdotal run 代替。
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.roi-admission-order
  - key: early-real-entry-feedback
    source_ref: docs/long-task-real-capability-closure.md
    statement: material UI + selected design 在第一个有用的真实生产入口可运行且早期定位收益高于运行成本时，建议用最终同类 observer 做一次页面 Anatomy、信息/行动层级、整体视觉模式和区域关系的早期并排检查；它不新增 Gate、状态、Receipt 或完成前提，早期 artifact 仅供诊断，最终候选必须重新采集并跑完整 cold-start journey。
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.early-real-entry-feedback
  - key: no-new-lifecycle-authority-registry
    source_ref: docs/long-task-real-capability-closure.md
    statement: 所有修复复用现有 Source、Contract、Compile、Evidence Kernel、Counterfactual、Final Gate、External Confirmation、Trust Boundary Gate 和 critical sentinel registry；不得新增 Long-Task 阶段、Gate、Authority、scheduler、Receipt、机制矩阵、运行时 registry 或持久状态。逻辑 Fact 细粒度不等于每个 Fact 启动一次进程：允许共享 Raw Execution/artifact，但不允许共享不可区分的 total Boolean/verdict。
    disposition:
      type: claim
      refs:
        - assurance-governance.obligation.no-new-lifecycle-authority-registry
  - key: owner-dependency-lifecycle-boundary
    source_ref: docs/long-task-real-capability-closure.md
    statement: selected-design comparison owner 是 `long-task-evidence-capability-runtime.ts`，共享 exact/result identity 语义来自 `long-task-semantic-fact-evidence.ts` 或新提取的同层 primitive，设计方法 taxonomy 保持在 `design-resource-fact-policy.ts` 与 `design-resource-fact-property-methods.ts`，Final Gate 保持唯一 acceptance carrier。依赖只能从 Source/Context 经 Contract、observer、comparison 流向 Final Gate；comparison primitive 不依赖项目 verifier 的 verdict，observer adapter 不拥有 expected；失败必须显式、资源与临时 session 必须有界清理，重试不能把旧 artifact 变成当前证据。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.obligation.owner-dependency-lifecycle-boundary
  - key: build-reuse-buy-allowed-set
    source_ref: docs/long-task-real-capability-closure.md
    statement: Build/Reuse/Buy 允许集合包括：复用现有 semantic-fact exact/result-identity owner；复用现有 design policy/property-method owners；用标准库做有界 package-owned extractor/comparator；使用已安装或成熟且 license/platform/size 兼容的依赖；使用 digest/version/capability 冻结的 executable adapter；以及对未准入观察有意不抽象并保留 External Confirmation。选择前必须枚举本次可行成员；禁止重复 owner-held rule、第二 source of truth、扩张式通用 parser、无依据重依赖、nonce-only 信任、自报 Boolean、错误依赖方向和为了相似语义强制抽象。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.obligation.build-reuse-buy-allowed-set
  - key: technical-debt-and-future-change
    source_ref: docs/long-task-real-capability-closure.md
    statement: 已触及技术债是 non-UI 与 selected-design validation 的 exact/result-identity 路径分叉，处置为在不改变现有外部 schema 的前提下共享 primitive 并用两类回归锁定；不得留下新的第三路径。未来新增 comparator、locator、artifact schema、symbolic version 或 native adapter，必须通过共享 capability 接口、明确 TCB、攻击/控制组和协议准入，不得复制 validator 或把新格式默认为可信。
    disposition:
      type: claim
      refs:
        - p0-exact-recomputation.obligation.technical-debt-and-future-change
  - key: compatibility-security-resource-boundaries
    source_ref: docs/long-task-real-capability-closure.md
    statement: 安全与可靠性边界包括 fail-closed parsing、路径 containment、symlink 防逃逸、大小/深度/时间/内存上限、敏感观察的 digest-only/redaction、冻结 executable 与依赖闭包 identity、challenge replay protection、当前 candidate/session 绑定和临时进程/artifact 清理。兼容性必须保持普通 default workflow、非 UI Long-Task、现有 V1 默认与 V2 opt-in、合法 tolerance/mask 和 External Confirmation；任何 public/protocol 变化都必须有显式 migration/rollout/rollback 或不可逆边界说明。
    disposition:
      type: claim
      refs:
        - observer-tcb-closure.obligation.compatibility-security-resource-boundaries
  - key: context-and-public-authority-update
    source_ref: docs/long-task-real-capability-closure.md
    statement: "总体 `Context Delta: required`。必须在代码前更新 `PROJECT_SPEC.md` 和 owning Context，记录路线 B 的项目 owner 决策、旧/新定理边界、observer capability/TCB、目的有效性下限、critical counterexample/claim downgrade、owner/dependency/debt/compatibility/验证；实现索引与验证 Context 必须指向真实代码与检查。若改变公共用户行为或协议，还要同步 managed source、Skills、英文/中文公共文档、package/readme/examples 和 distribution parity；P0 单独行为修复不需要虚构新的 durable owner。"
    disposition:
      type: claim
      refs:
        - proof-and-roi.requirement.context-and-public-authority-update
  - key: verification-sequence-and-current-candidate
    source_ref: docs/long-task-real-capability-closure.md
    statement: 验证顺序为：确定性攻击/正确控制组；focused 与 changed-path affected checks；Long-Task Trust Boundary Gate；complete tests/package source parity/tarball/consumer/release regression；受控脱敏真实回放；仅用于遵循率和 ROI 的 fresh-agent 配对；Context drift；最后由本 Goal 的唯一 Long-Task Final Gate 在同一干净 current candidate 上重编译并重跑全部声明 Checks。任何 Source、Context、Contract、verifier、实现或控制输入变化后必须重跑受影响检查，历史绿色不得继承。
    disposition:
      type: acceptance
      refs:
        - proof-and-roi.verify-proof-and-roi.acceptance-verification-sequence-and-current-candidate
  - key: final-hard-acceptance
    source_ref: docs/long-task-real-capability-closure.md
    statement: 最终硬验收要求：UI exact mismatch 绝不通过；expected-as-actual、自报 verdict、aggregate status、纯 evidence carrier、历史 session/截图/build、browser/H5 代理 native、task-authored 唯一 material Oracle 均不能虚假 machine-accept；material design Fact 无遗漏、错误方法或静默 N/A；当前 target/snapshot/session 与 production reachability 可证；Counterfactual 改变真实 carrier 和对应 actual；合法 tolerance/mask/共享执行/fan-out 正常；目的有效性先于相对不劣化；无开放 critical counterexample；非适用任务不增加流程；适用任务 ROI 为正；没有新增阶段、Authority、Gate、scheduler、registry 或持久状态。
    disposition:
      type: acceptance
      refs:
        - proof-and-roi.verify-proof-and-roi.acceptance-final-hard-acceptance
  - key: approved-final-capability-wording
    source_ref: docs/long-task-real-capability-closure.md
    statement: 只有全部硬验收成立后，正式能力表述才可恢复为：Long-Task Workflow 在完整、准确的声明范围、预期细粒度和已准入观察/TCB 内，允许模型在中间理解、实现和修复中自然发生漂移、遗漏或幻觉；但 Source→Contract 的声明内语义遗漏、准入 observer 能发现的当前生产差异、历史或代理证据、自证式 actual、错误 comparison/verdict 及未证明边界，不能进入最终 `machine_accepted`。对于无法建立可信机器观察的事实，工作流保持未完成或 External Confirmation。该表述不声称覆盖未表达意图或 TCB 外任意行为。
    disposition:
      type: claim
      refs:
        - assurance-governance.requirement.approved-final-capability-wording
  - key: critical-scope-escape-risk
    source_ref: docs/long-task-real-capability-closure.md
    statement: 主要范围逃逸风险是把路线 B 演变为任意 UI/任意 native/任意 Oracle 的通用观察框架，或趁机重建设计 Fact taxonomy、生命周期实体和协议版本。准入首版必须以有限格式、明确 capability、现有 owners 和 External Confirmation 为边界；超出边界的扩展需要新的 Source/Context 决策与独立 ROI 证据。
    disposition:
      type: risk_fact
      refs:
        - critical_user_path:observer-tcb-closure
  - key: critical-self-attestation-risk
    source_ref: docs/long-task-real-capability-closure.md
    statement: 主要 TCB 风险是同一模型同时编写实现、verifier、actual、comparison 和 verdict，或 runner 回显 challenge 后继续自证。任何允许 project self-attestation 单独关闭 material Claim、允许 actual 从 expected/report 读取、或只校验字段内部一致性的实现都属于 forbidden shortcut，并阻止 handoff。
    disposition:
      type: risk_fact
      refs:
        - weak_observability:observer-tcb-closure
  - key: critical-claim-inflation-risk
    source_ref: docs/long-task-real-capability-closure.md
    statement: 主要治理风险是以文档、绿测、哨兵名称、Agent benchmark 或 P0 局部成功重新宣称完整高水准能力。能力等级必须由机器攻击/控制组、明确 TCB、黑盒 Final Gate、真实回放和开放反例状态共同约束；任何超出证据范围的 rationale 或发布结论都视为防劣化失败。
    disposition:
      type: risk_fact
      refs:
        - critical_user_path:assurance-governance
stages:
  - key: stage-p0-exact-recomputation
    title: P0 exact recomputation
    depends_on: []
    gate_outcome: p0-exact-recomputation
  - key: stage-assurance-governance
    title: Assurance governance
    depends_on:
      - stage-p0-exact-recomputation
    gate_outcome: assurance-governance
  - key: stage-observer-tcb-closure
    title: Observer and TCB closure
    depends_on:
      - stage-assurance-governance
    gate_outcome: observer-tcb-closure
  - key: stage-proof-and-roi
    title: Proof and ROI
    depends_on:
      - stage-observer-tcb-closure
    gate_outcome: proof-and-roi
risk:
  requested_level: strict
  facts:
    public_api_or_schema_change: []
    persistent_data_change: []
    data_migration: []
    security_boundary_change: []
    permission_boundary_change: []
    irreversible_external_effect: []
    critical_user_path:
      - p0-exact-recomputation
      - observer-tcb-closure
      - assurance-governance
    full_population_operation: []
    multi_repository_change: []
    weak_observability:
      - observer-tcb-closure
global:
  applicability:
    - key: global-current-success
      target_ref: harness-package-runtime
      journey_role: success
      dimensions:
        - key: candidate
          value: current
      given_refs:
        - global-source-locked
      when_refs:
        - global-verify-current
  product:
    non_goals:
      - key: no-universal-ui-observer
        statement: 首版明确不建设任意 HTML/native/UI 的通用理解、布局、像素、无障碍、时间线或 custom locator 框架，不承诺证明任意 Oracle 语义真实性，也不通过多加字段制造伪 TCB。支持范围外的 target/Fact 必须诚实转为 External Confirmation，后续格式只能经独立机制准入与收益证据扩展。
        applicability_refs:
          - global-current-success
  technical:
    constraints: []
    forbidden_paths: []
    forbidden_shortcuts: []
  acceptance:
    checks:
      - key: verify-global-observer-boundary
        journey_roles:
          - success
          - conformance
        execution_target:
          target_ref: harness-package-runtime
          entrypoint: root
        scenario:
          given:
            - key: global-source-locked
              statement: The route-B observer boundary is available.
          when:
            - key: global-verify-current
              statement: Inspect the bounded observer non-goal.
        proof_surface: runtime_behavior
        runner:
          type: node_oracle
          target: tools/verify_long_task_real_capability_delivery.mjs
          argv:
            - observer-tcb-closure
            - global-conformance
          cwd: .
          timeout_ms: 900000
          effect: read_only
          retry_policy: none
          idempotent: true
        verification_inputs:
          - tools/verify_long_task_real_capability_delivery.mjs
          - tools/semantic_fact_delivery_evidence.mjs
          - tools/npm_command_spec.mjs
          - tests/ty-context/long-task-real-capability-closure.test.mjs
        input_paths:
          - packages/ty-context/src/lib/long-task-artifacts.ts
          - packages/ty-context/src/lib/long-task-evidence-capability-runtime.ts
          - packages/ty-context/src/lib/long-task-evidence-capability-policy.ts
          - packages/ty-context/src/lib/long-task-evidence-v2.ts
          - packages/ty-context/src/lib/long-task-evidence-sensitivity-policy.ts
          - tests/ty-context/fixtures/long-task-real-capability-state.json
        expected_output_paths:
          - packages/ty-context/dist/**
          - tests/src/**
          - tests/artifacts/**
          - tests/ty-context/base-oracle.mjs
        artifact_globs:
          - artifacts/semantic-fact-results.json
        positive_assertions:
          - key: global-observer-liveness
            criterion: The package observer verification target remains live under mutation.
            claims: []
            observation: target_live
            evidence_capabilities:
              - target_runtime
            operator: equals
            expected: true
        negative_assertions:
          - key: non-goal-no-universal-ui-observer
            criterion: 首版明确不建设任意 HTML/native/UI 的通用理解、布局、像素、无障碍、时间线或 custom locator 框架，不承诺证明任意 Oracle 语义真实性，也不通过多加字段制造伪 TCB。支持范围外的 target/Fact 必须诚实转为 External Confirmation，后续格式只能经独立机制准入与收益证据扩展。
            claims:
              - non_goal.no-universal-ui-observer
            applicability_ref: global-current-success
            observation: non_goal_no_universal_ui_observer
            evidence_capabilities:
              - target_runtime
              - state_delta
            operator: equals
            expected: true
        environment_requirements:
          - key: node
            kind: executable
            target: node
    counterfactual_controls:
      - key: mutate-global-no-universal-ui-observer
        binding_ref: observer-tcb-closure.admitted-observation-owner
        claims:
          - non_goal.no-universal-ui-observer
        check_key: verify-global-observer-boundary
        mutation:
          type: replace_text
          path: packages/ty-context/src/lib/long-task-admitted-observation.ts
          match: JSON_POINTER_EXACT_CAPABILITY = "json-pointer-exact-v1"
          replacement: JSON_POINTER_EXACT_CAPABILITY = "json-pointer-exact-disabled"
        expected_assertion_failures:
          - non-goal-no-universal-ui-observer
        preserved_assertions:
          - global-observer-liveness
    external_confirmations: []
outcomes:
  - key: p0-exact-recomputation
