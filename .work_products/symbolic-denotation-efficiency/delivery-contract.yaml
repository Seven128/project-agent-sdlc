      refs:
        - symbolic-denotation-efficiency.obligation.v1-ground-cell-limit
  - key: v1-capacity-prefix-limit
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: The capacity-header streaming prefix is bounded to 65,536 bytes and admission rejects a manifest whose required header is not wholly available within that schema budget.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.obligation.v1-capacity-prefix-limit
  - key: v1-reject-before-hydration
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: A V1 size or expected-count violation is rejected before JSON parsing, manifest projection, condition or variation expansion and handoff hydration, with no partial acceptance.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.requirement.v1-reject-before-hydration
  - key: v1-threshold-measurement-basis
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: "Threshold evidence is the current repository complete fixture on Windows x64, Node 24.16.0 and an Intel i5-11400F: 33 condition axes, 30 variation-axis rows, 2 conditions, 6 subjects, 7 variations, 217 properties, 3,038 Fact Cells, 36 Facts and 48 proof obligations; embedded handoff 1,930,720 bytes, compact handoff 113,792 bytes and canonical manifest 4,411,120 bytes."
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.obligation.v1-threshold-measurement-basis
  - key: v1-capacity-actionable-diagnostics
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Capacity rejection reports measured bytes, declared counts, limit, the largest available contributors and the exact opt-in V2 regeneration route without logging protected expected values.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.obligation.v1-capacity-actionable-diagnostics
  - key: capacity-fail-closed-no-truncation
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Capacity protection never truncates, samples, summarizes, lowers granularity or silently falls back to a partial V1 universe; exceeding a budget is unavailable until the producer regenerates an admitted V2 representation.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.requirement.capacity-fail-closed-no-truncation
  - key: efficiency-admission-property-only
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Purpose-fulfillment efficiency non-degradation is a package mechanism-change admission and regression property evaluated before adopting or defaulting the mechanism.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.requirement.efficiency-admission-property-only
  - key: efficiency-not-terminal-safety-theorem
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Purpose-fulfillment efficiency non-degradation is not part of the AcceptedDeliveryTerminal safety theorem and cannot become a delivery-completion condition.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.requirement.efficiency-not-terminal-safety-theorem
  - key: no-second-authority
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Efficiency admission creates no second Source, Contract Authority, value authority or acceptance authority.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.obligation.no-second-authority
  - key: no-second-final-gate
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Efficiency admission creates no second Final Gate, package completion state or alternate machine-acceptance terminal.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.obligation.no-second-final-gate
  - key: no-delivery-deadline-condition
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: The mechanism introduces no delivery deadline, elapsed-time acceptance predicate or fixed completion-time promise.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.requirement.no-delivery-deadline-condition
  - key: no-fixed-execution-flow
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: The mechanism introduces no fixed implementation order, per-edit mandate, scheduler, agent-allocation rule or workflow phase beyond the existing Goal-owned freedom boundary.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.requirement.no-fixed-execution-flow
  - key: performance-claim-measurement-contract
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Any runtime efficiency claim must name workload, metric, baseline or budget, environment, comparator and tolerance and must be produced by a project-owned current-candidate measurement; static representation shape alone is not runtime proof.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.obligation.performance-claim-measurement-contract
  - key: non-ui-v2-separate-admission
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Non-UI semantic-fact V2 is outside this delivery and requires a separate admission after UI V2 proves the shared engine boundary; existing semantic-fact-manifest-v1 behavior is unchanged here.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.requirement.non-ui-v2-separate-admission
  - key: provider-p0-excluded
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Provider trust-boundary and P0 acquisition changes are outside this delivery because no repository-reproducible failure evidence currently justifies them.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.requirement.provider-p0-excluded
  - key: provider-reentry-evidence-required
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Provider or P0 scope may re-enter only through a separately reviewed repository-reproducible failing fixture, exact ownership analysis and Authority revision or new delivery.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.requirement.provider-reentry-evidence-required
  - key: shared-engine-future-boundary
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: The symbolic predicate and canonical DAG engine is domain-neutral and package-owned, but UI schema, applicability policy and Contract projection remain UI-owned so a future non-UI admission can reuse the engine without importing UI semantics.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.obligation.shared-engine-future-boundary
  - key: rollout-1-v1-capacity
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Rollout step 1 ships and verifies V1 stat and bounded-stream capacity protection before any V2 default behavior.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.requirement.rollout-1-v1-capacity
  - key: rollout-2-formal-denotation
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Rollout step 2 freezes the formal V1/V2 extensional denotation and equivalence predicates before production symbolic projection is accepted.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.requirement.rollout-2-formal-denotation
  - key: rollout-3-engine-independent-oracle
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Rollout step 3 implements the internal symbolic engine together with an independently authored test-only full finite expander and comparator Oracle.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.requirement.rollout-3-engine-independent-oracle
  - key: rollout-4-ui-v2-opt-in
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Rollout step 4 admits UI V2 only as explicit opt-in after equivalence and complexity counterexamples pass.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.requirement.rollout-4-ui-v2-opt-in
  - key: rollout-5-mixed-downstream
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Rollout step 5 admits mixed V1 and V2 downstream Contract and evidence closure in the same Final Gate.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.requirement.rollout-5-mixed-downstream
  - key: rollout-6-default-after-proof
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Rollout step 6 may change the UI default only in a later Authority-backed decision after equivalence, compatibility, false-negative resistance and measured efficiency admission remain passing; this delivery does not flip the default.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.requirement.rollout-6-default-after-proof
  - key: rollout-7-non-ui-provider-separate
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Rollout step 7 treats non-UI V2 and any Provider trust-boundary work as separate admissions with their own evidence rather than implied follow-through.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.requirement.rollout-7-non-ui-provider-separate
  - key: independent-full-finite-test-expander
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Tests use an independently implemented full finite extensional expander and direct denotation comparator that does not call the production DAG canonicalizer or reuse its reduction logic.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.obligation.independent-full-finite-test-expander
  - key: exhaustive-pointwise-equivalence-tests
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Bounded exhaustive and property-generated tests compare V1 and V2 at every finite subject or relation, target, reachable condition or variation, applicable property and population or quantifier point for disposition, expected semantics and proof-obligation denotation.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.obligation.exhaustive-pointwise-equivalence-tests
  - key: adversarial-false-completion-counterexamples
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Executable counterexamples independently remove or alter a condition, variation, property applicability region, relation endpoint, population quantifier, required method, expected locator, comparator, certificate edge or current result and must fail at the attributable identity.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.obligation.adversarial-false-completion-counterexamples
  - key: mixed-contract-verification
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Tests compile and evidence one Contract containing at least one V1 target and one V2 target and reject cross-target binding, result and version confusion.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.obligation.mixed-contract-verification
  - key: capacity-early-rejection-verification
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Tests instrument read, parse, hydrate and expansion boundaries to prove oversized V1 inputs are rejected after stat or bounded prefix inspection and before full read, JSON parse, hydration or Cartesian work.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.obligation.capacity-early-rejection-verification
  - key: complexity-parameter-verification
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Parameter tests add irrelevant axes, values and dependency edges and assert exact denotation stability plus bounded obligation count, certificate coverage representation, canonical DAG nodes and bytes while theoretical ground cardinality grows.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.obligation.complexity-parameter-verification
  - key: distribution-context-parity
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Implementation, strict schemas, CLI, public types, package assets, managed workspace copies, README surfaces, PROJECT_SPEC, owning Context, implementation index, affected and Trust routing and focused tests must teach and enforce the same versioned semantics, scope and rollout.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.obligation.distribution-context-parity
  - key: architecture-deliberation
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: "Architecture Deliberation: owners are design-resource handoff parsing and fact policy, the shared symbolic-denotation engine, Long-Task UI projection and evidence runtime, package distribution and owning Context; current extension points are V1 fact-manifest projection and Long-Task fact_expectations/fact_results. The selected design is a versioned opt-in UI V2 with restricted predicates, canonical shared DAGs, mutually exclusive regions, constant located expected values, complete package-policy plus Inspector-Census applicability, separately typed semantic and certificate obligations, V1 preparse capacity guards and mixed V1/V2 Final-Gate closure. Dependencies flow from canonical resources through handoff validation into Contract bindings and current evidence, never backward into value authority; state remains Contract and current-run owned and adds no lifecycle. Rejected alternatives are mutating V1, DNF or full expansion, post-expansion deduplication, arbitrary value functions, precedence, sampling, ungrounded N/A, historical proof reuse, non-UI bundling and Provider/P0 expansion. A future new predicate theory or non-UI consumer must extend the shared engine through a separately admitted domain policy without weakening canonical identity. Existing Cartesian memory risk is paid down through V1 early guards and V2 symbolic normalization; unrelated Provider debt is left out with an evidence re-entry condition. Project-owned equivalence, adversarial, capacity, mixed-version, distribution, complete-suite, Context and Final-Gate checks prove the declared design. Correctness, maintainability, compatibility, performance/capacity, reliability, operability and testability are triggered; security/privacy are preserved through strict grammar, bounded parsing and protected-value semantics."
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.obligation.architecture-deliberation
  - key: no-sampling
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Do not use representative, pairwise, random-only or risk-selected sampling to stand in for complete extensional denotation, applicability or final proof closure.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.forbidden_shortcut.no-sampling
  - key: no-granularity-reduction
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Do not reduce Fact, atomic property, condition, variation, relation, population, quantifier, required-method or observation-boundary granularity to obtain smaller artifacts.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.forbidden_shortcut.no-granularity-reduction
  - key: no-expand-then-deduplicate
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Do not first materialize the ground Cartesian universe and then group, hash, compress or deduplicate it; production complexity must be symbolic from input onward.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.forbidden_shortcut.no-expand-then-deduplicate
  - key: no-historical-proof-reuse
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Do not reuse historical tests, receipts, Progress or a prior candidate's semantic or certificate results as current Final-Gate proof.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.forbidden_shortcut.no-historical-proof-reuse
  - key: no-authority-gate-proliferation
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Do not add a second Source, Contract, Authority, Final Gate, terminal theorem, registry, package completion state or acceptance workflow for symbolic or efficiency admission.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.forbidden_shortcut.no-authority-gate-proliferation
  - key: no-arbitrary-symbolic-execution
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Do not admit arbitrary code, opaque predicates, implementation-owned expected-value functions or ordered override precedence into V2 Rules.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.forbidden_shortcut.no-arbitrary-symbolic-execution
  - key: no-ungrounded-applicability-omission
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Do not use a missing property, omitted axis, empty Census row, broad not-applicable label or provider complete flag as evidence-backed applicability closure.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.forbidden_shortcut.no-ungrounded-applicability-omission
  - key: v1-v2-denotation-equivalence-ac
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Given V1 and V2 representations of the same finite design universe, the independent expander observes set-equal pointwise disposition, expected semantics and proof-obligation denotation across every subject or relation, target, reachable condition or variation, applicable property and population or quantifier point; mutating any one component fails the exact comparison.
    disposition:
      type: acceptance
      refs:
        - symbolic-denotation-efficiency.semantic-check.v1-v2-denotation-equivalence-ac
  - key: canonical-region-and-applicability-ac
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Given overlapping, gapped, redundant, reordered and Census-incomplete Rule inputs, valid equivalent inputs normalize to one digest while overlap, gap, unknown applicability, missing basis, unreachable claimed coverage and nonconstant expected values each fail closed.
    disposition:
      type: acceptance
      refs:
        - symbolic-denotation-efficiency.semantic-check.canonical-region-and-applicability-ac
  - key: mixed-contract-current-evidence-ac
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Given one Contract with V1 and V2 targets, Compile preserves each representation's exact expectations and the existing Final Gate accepts only exact current V1 fact results, V2 Rule-method-region results and recomputed certificate results with no cross-target substitution.
    disposition:
      type: acceptance
      refs:
        - symbolic-denotation-efficiency.semantic-check.mixed-contract-current-evidence-ac
  - key: noninterference-complexity-ac
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Given fixtures with increasing irrelevant axes, values and dependency edges, theoretical ground cardinality grows while denotation stays equal and obligation counts, exact set-valued certificate coverage, canonical DAG nodes and bytes remain within declared ground-independent budgets; adding a relevant dependency invalidates the certificate.
    disposition:
      type: acceptance
      refs:
        - symbolic-denotation-efficiency.semantic-check.noninterference-complexity-ac
  - key: v1-capacity-guard-ac
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Given V1 resources immediately below and above each byte, header and Fact Cell threshold, below-limit fixtures preserve V1 results and above-limit fixtures fail with measured diagnostics before prohibited full read, parse, hydration or Cartesian work; no row is truncated.
    disposition:
      type: acceptance
      refs:
        - symbolic-denotation-efficiency.semantic-check.v1-capacity-guard-ac
  - key: scope-and-rollout-ac
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Given legacy V1, explicit UI V2, non-UI semantic facts and Provider inputs, V1 remains default, UI V2 requires opt-in, mixed targets work, non-UI and Provider behavior remains unchanged and no later rollout step is treated as already authorized.
    disposition:
      type: acceptance
      refs:
        - symbolic-denotation-efficiency.semantic-check.scope-and-rollout-ac
  - key: package-antidegradation-and-parity-ac
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Given the final candidate, focused equivalence, canonicalization, applicability, capacity, mixed-version, evidence, complexity and guidance tests plus the complete package suite, source parity, Context validation, Harness validation and sole Final Gate all pass from one committed snapshot without forbidden shortcuts or scope escape.
    disposition:
      type: acceptance
      refs:
        - symbolic-denotation-efficiency.complete-check.package-antidegradation-and-parity-ac
  - key: inventory-is-not-completion
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: A complete Source, semantic manifest, symbolic DAG, certificate inventory, preflight, Compile, focused test, benchmark, Progress record or prose review alone does not complete delivery; only all declared checks rerun by the existing sole Final Gate on the current committed candidate can do so.
    disposition:
      type: claim
      refs:
        - symbolic-denotation-efficiency.non_completing.inventory-is-not-completion
  - key: public-schema-change-risk
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: This delivery adds versioned public UI handoff, Contract and evidence schema surfaces, so strict parser/schema/type parity, compatibility diagnostics, fixtures, documentation and package distribution must change together.
    disposition:
      type: risk_fact
      refs:
        - public_api_or_schema_change:symbolic-denotation-efficiency
  - key: false-completion-critical-path-risk
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: Symbolic omission is false-completion-critical because an overlap, gap, omitted dependency, narrowed applicability set or missing method can otherwise preserve aggregate green results while changing extensional meaning.
    disposition:
      type: risk_fact
      refs:
        - critical_user_path:symbolic-denotation-efficiency
  - key: symbolic-oracle-observability-risk
    source_ref: docs/symbolic-denotation-efficiency.md
    statement: The Harness can prove declared canonicalization, denotation equality, certificate recomputation and current result closure, but semantic soundness of the frozen Inspector and independent test Oracle remains a named trusted-computing boundary requiring counterexamples and honest blocking.
    disposition:
      type: risk_fact
      refs:
        - weak_observability:symbolic-denotation-efficiency
