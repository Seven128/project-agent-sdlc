        - forbidden_shortcut.no-historical-proof-reuse
        applicability_ref: root-success
        observation: no_historical_proof_reuse_used
        evidence_capabilities:
        - target_runtime
        operator: equals
        expected: false
      - key: no-authority-gate-proliferation
        criterion: Do not add a second Source, Contract, Authority, Final Gate, terminal theorem, registry, package completion state or acceptance workflow for symbolic or efficiency admission.
        claims:
        - forbidden_shortcut.no-authority-gate-proliferation
        applicability_ref: root-success
        observation: no_authority_gate_proliferation_used
        evidence_capabilities:
        - target_runtime
        operator: equals
        expected: false
      - key: no-arbitrary-symbolic-execution
        criterion: Do not admit arbitrary code, opaque predicates, implementation-owned expected-value functions or ordered override precedence into V2 Rules.
        claims:
        - forbidden_shortcut.no-arbitrary-symbolic-execution
        applicability_ref: root-success
        observation: no_arbitrary_symbolic_execution_used
        evidence_capabilities:
        - target_runtime
        operator: equals
        expected: false
      - key: no-ungrounded-applicability-omission
        criterion: Do not use a missing property, omitted axis, empty Census row, broad not-applicable label or provider complete flag as evidence-backed applicability closure.
