    technical:
      obligations:
        - key: complete-material-input-index
          statement: The immutable attachment identity, user-supplied amendments, adopted audit blockers, controlling Context, canonical repository specifications and preservation documents must all be indexed with exact provenance and no material fragment hidden as supporting-only.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: fact-identity-proof-obligation-separation
          statement: A semantic Fact identity denotes one expected predicate independently of proof method; Fact identity, semantic proof obligation identity and representation-certificate identity remain separate typed namespaces.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: required-method-denotation-preservation
          statement: V2 must preserve every property-required verification method and the furthest independently failing observation boundary; one convenient method or certificate cannot discharge a different required method.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: comparison-oracle-environment-preservation
          statement: Existing exact expected locators and digests, comparator parameters, authoritative tolerance or mask, Oracle identity, deterministic environment identity and current verdict semantics remain frozen through V2 projection.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: protected-observation-preservation
          statement: Protected observations may remain behind immutable artifact locators and digests, but V2 may not weaken sensitivity classification, redaction policy, attribution or falsifiability.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: canonical-resource-value-authority
          statement: Immutable canonical design resources remain the sole owner of exact design values; the handoff, Contract, DAG and certificates store identities, locators and bindings rather than copied expected values.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: versioned-ui-symbolic-v2
          statement: Introduce a distinct versioned UI symbolic manifest and handoff V2 while leaving the existing V1 schema, parser and semantics intact.
          required_proof_surfaces:
            - runtime_behavior
            - api_contract
          applicability_refs:
            - root-success
        - key: restricted-symbolic-predicate-dsl
          statement: The production symbolic engine accepts only a package-owned, versioned, strict predicate DSL with enum equality or membership, bounded numeric ranges, all, any and not; unknown operators and arbitrary executable predicates fail closed.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: finite-enum-and-bounded-numeric-domains
          statement: Every symbolic axis has an explicitly finite enum domain or a bounded numeric domain with exact boundary semantics; open-ended or implementation-discovered domains are unavailable.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: canonical-shared-decision-dag
          statement: Production normalization uses one package-owned canonical ordered multi-valued decision DAG with deterministic axis order, theory-aware domain partitions, hash-consed nodes, memoized Boolean operations and shared subtrees.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: unreachable-branch-elimination
          statement: Canonicalization removes unreachable branches using declared domain theory without enumerating the full Cartesian assignment space.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: no-production-ground-materialization
          statement: Production parsing, validation, canonicalization, Contract projection and evidence comparison must not materialize the theoretical ground Cartesian universe, including as an intermediate later deduplicated form.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: no-rule-precedence-or-value-function
          statement: The first V2 rejects ordered override precedence, computed expected-value functions, arbitrary code and late implementation-owned value resolution because they weaken canonical mutual exclusion and equivalence proof.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: deterministic-canonical-identity
          statement: Equivalent symbolic inputs normalize to the same canonical DAG serialization and digest independent of declaration ordering, redundant predicates or chunk boundaries.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: symbolic-complexity-fuse
          statement: Fail-closed complexity fuses bound predicate depth, input predicate nodes, canonical DAG nodes, partition edges and canonical bytes; exhaustion reports unavailable and never samples or truncates.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: ground-cardinality-diagnostic-only
          statement: Theoretical ground cardinality is computed with overflow-safe integer arithmetic for diagnostics and admission comparisons only; it is never used to allocate or iterate a ground array in production.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: relation-population-first-class-model
          statement: Symbolic Fact Rules model local subjects, typed relations, static populations and dynamic populations directly; relation endpoints or population members cannot be hidden in labels.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: population-quantifier-denotation
          statement: Each Rule and semantic obligation preserves exact one, all, any, none, exactly, at-least, at-most or range quantifier meaning and its population reference.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: v2-rule-method-region-projection
          statement: For an opted-in V2 target, Long-Task compilation projects each semantic Fact Rule to every required method and only the necessary canonical method region, without reconstructing V1 ground rows.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: stable-symbolic-fact-rule-identity
          statement: V2 Fact Rule identities are stable under canonical-equivalent predicate rewrites while semantic proof obligations and certificate obligations retain distinct identities.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: per-method-region-obligations
          statement: Every property-required method receives an independently attributable semantic obligation over its exact canonical region, comparator, Oracle, environment and observation boundary.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: typed-v2-rule-results
          statement: Current-candidate V2 evidence contains typed per-Rule and per-method-region results with attributable actual observation, comparison, verdict, Oracle, environment and protected-value policy.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: typed-certificate-results
          statement: Current-candidate V2 evidence contains typed separately evaluated non-interference certificate results; a certificate declaration without a fresh recomputed result proves nothing.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: mixed-target-one-final-gate
          statement: The existing Long-Task Final Gate evaluates mixed V1 and V2 target expectations together and remains the sole current-snapshot acceptance carrier.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: certificate-package-recomputation
          statement: The package recomputes certificate coverage, variable dependence, region equivalence and canonical identities from frozen symbolic inputs; provider or author complete booleans are not trusted.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: certificate-not-semantic-proof-substitute
          statement: Non-interference certificates prove only safe representation omission and sharing; they do not replace pointwise semantic Facts, required-method denotation or current production observations.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: v1-stat-before-read
          statement: V1 handoff and manifest resources are stat-checked against declared byte budgets before any whole-file read, YAML or JSON parse, hydration or Cartesian validation.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: v1-bounded-prefix-stream-parse
          statement: Compact V1 manifest admission reads at most the declared bounded prefix to obtain schema version and generation collection counts before whole-file parsing; a missing or late capacity header fails with actionable guidance.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: v1-capacity-header-order
          statement: V1 canonical manifest serialization places schema identity and generation collection count metadata before large collections so the bounded preparse is deterministic and does not scan the full document.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: v1-embedded-handoff-byte-limit
          statement: The embedded V1 handoff hard limit is 8,388,608 bytes, derived as the next power of two above four times the measured 1,930,720-byte complete reference fixture.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: v1-manifest-byte-limit
          statement: The compact V1 canonical manifest hard limit is 33,554,432 bytes, derived as the next power of two above four times the measured 4,411,120-byte complete reference fixture.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: v1-ground-cell-limit
          statement: The V1 explicit expected Fact Cell hard limit is 16,384, derived as the next power of two above four times the measured 3,038-cell complete reference fixture; V2 regeneration is the required path above it.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: v1-capacity-prefix-limit
          statement: The capacity-header streaming prefix is bounded to 65,536 bytes and admission rejects a manifest whose required header is not wholly available within that schema budget.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: v1-threshold-measurement-basis
          statement: "Threshold evidence is the current repository complete fixture on Windows x64, Node 24.16.0 and an Intel i5-11400F: 33 condition axes, 30 variation-axis rows, 2 conditions, 6 subjects, 7 variations, 217 properties, 3,038 Fact Cells, 36 Facts and 48 proof obligations; embedded handoff 1,930,720 bytes, compact handoff 113,792 bytes and canonical manifest 4,411,120 bytes."
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: v1-capacity-actionable-diagnostics
          statement: Capacity rejection reports measured bytes, declared counts, limit, the largest available contributors and the exact opt-in V2 regeneration route without logging protected expected values.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: no-second-authority
          statement: Efficiency admission creates no second Source, Contract Authority, value authority or acceptance authority.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: no-second-final-gate
          statement: Efficiency admission creates no second Final Gate, package completion state or alternate machine-acceptance terminal.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: performance-claim-measurement-contract
          statement: Any runtime efficiency claim must name workload, metric, baseline or budget, environment, comparator and tolerance and must be produced by a project-owned current-candidate measurement; static representation shape alone is not runtime proof.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: shared-engine-future-boundary
          statement: The symbolic predicate and canonical DAG engine is domain-neutral and package-owned, but UI schema, applicability policy and Contract projection remain UI-owned so a future non-UI admission can reuse the engine without importing UI semantics.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: independent-full-finite-test-expander
          statement: Tests use an independently implemented full finite extensional expander and direct denotation comparator that does not call the production DAG canonicalizer or reuse its reduction logic.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: exhaustive-pointwise-equivalence-tests
          statement: Bounded exhaustive and property-generated tests compare V1 and V2 at every finite subject or relation, target, reachable condition or variation, applicable property and population or quantifier point for disposition, expected semantics and proof-obligation denotation.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: adversarial-false-completion-counterexamples
          statement: Executable counterexamples independently remove or alter a condition, variation, property applicability region, relation endpoint, population quantifier, required method, expected locator, comparator, certificate edge or current result and must fail at the attributable identity.
          required_proof_surfaces:
            - runtime_behavior
          applicability_refs:
            - root-success
        - key: mixed-contract-verification
          statement: Tests compile and evidence one Contract containing at least one V1 target and one V2 target and reject cross-target binding, result and version confusion.
          required_proof_surfaces:
            - runtime_behavior
