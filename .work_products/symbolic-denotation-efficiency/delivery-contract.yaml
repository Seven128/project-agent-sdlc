        criterion: A complete Source, semantic manifest, symbolic DAG, certificate inventory, preflight, Compile, focused test, benchmark, Progress record or prose review alone does not complete delivery; only all declared checks rerun by the existing sole Final Gate on the current committed candidate can do so.
