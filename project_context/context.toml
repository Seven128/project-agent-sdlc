default_files = ["project_context/architecture.md"]
# Source workspace routing; architecture is explicitly selected without traversing its children.

[[areas]]
id = "harness-package"
root = "packages/ty-context"
context = "project_context/areas/harness-package.md"
kind = "npm-package"
default = true

[[context]]
path = "project_context/areas/harness-package/foundation/context-model.md"
role = "foundation"
read_policy = "on-demand"
triggers = ["context model", "design resource references", "controlling sources"]

[[context]]
path = "project_context/areas/harness-package/contracts/workflow-contract.md"
role = "contract"
read_policy = "on-demand"
triggers = ["workflow contract", "development contract", "adopted design implementation", "capability reuse"]

[[context]]
path = "project_context/areas/harness-package/contracts/package-managed-surfaces.md"
role = "contract"
read_policy = "on-demand"
triggers = ["package managed surfaces", "optional skills", "design resource distribution", "Stitch MCP"]

[[context]]
path = "project_context/areas/harness-package/contracts/temporary-content-governance.md"
role = "contract"
read_policy = "on-demand"
triggers = ["temporary content governance"]

[[context]]
path = "project_context/areas/harness-package/decision-rationale/minimal-context.md"
role = "decision-rationale"
read_policy = "on-demand"
triggers = ["minimal context"]

[[context]]
path = "project_context/areas/harness-package/implementation-index.md"
role = "implementation-index"
read_policy = "on-demand"
triggers = ["implementation index"]

[[context]]
path = "project_context/areas/harness-package/verification.md"
role = "verification"
read_policy = "on-demand"
triggers = ["verification"]
